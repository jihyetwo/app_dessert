 위에 차려지는 수많은 반찬과 술, 식사 메뉴를 마주하게 됩니다.</p>\n<p>문제는 고기 한 조각의 칼로리가 아니라, <b>'삼겹살집 테이블 한 상' 전체의 총 칼로리 폭탄</b>입니다. 과연 우리가 한 끼에 섭취하는 총 열량은 얼마나 될까요?</p>\n<h3>Point 02. 칼로리 계산해봤습니다: 1인 기준 무려 2,280 kcal!</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2: 칼로리 계산</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>삼겹살집에서 통상적으로 1인이 섭취하는 대표 메뉴들의 칼로리를 식약처 공식 영양 데이터로 정밀 계산해보았습니다:</p>\n<p>1. <b>🥓 삼겹살 2인분 (구운 것 약 400g):</b> `약 1,320 kcal`</p>\n<p>2. <b>🍶 일반 소주 1병 (360ml):</b> `약 408 kcal` (밥 1.3공기 상당)</p>\n<p>3. <b>🍜 마무리 물냉면 1그릇:</b> `약 550 kcal`</p>\n<p>➡️ <b>총합계:</b> <b>약 2,280 kcal</b></p>\n<blockquote>⚠️ **충격적인 팩트:** 성인 여성 기준 하루 권장 섭취 칼로리가 약 2,000kcal, 남성이 약 2,500kcal입니다. 즉, **하루 종일 나누어 먹어야 할 총 에너지 전체를 저녁 회식 단 한 끼에 전부 섭취**해버리는 셈입니다.</blockquote>\n<h3>Point 03. 반전: 진짜 범인은 '고기'가 아닙니다!</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3: 진짜 함정</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>여기서 가장 중요한 반전이 있습니다. <b>고기 자체는 죄가 없습니다.</b></p>\n<p>삼겹살에 들어있는 단백질과 불포화·포화지방은 소화 속도가 느려 든든한 포만감을 오래 유지시켜 주고, 근육 생성과 세포 구성에 기여합니다. 적당량의 고기만 먹었다면 절대 하루아침에 살이 찌지 않습니다. <b>진짜 우리를 살찌게 만든 주범은 '곁들이 음식' 3인방</b>입니다:</p>\n<p>1. <b>소주의 치명적 배신 (Empty Calories):</b> 알코올은 1g당 7kcal의 높은 열량을 내지만 영양가는 전혀 없는 '빈 칼로리'입니다. 우리 몸은 알코올이 들어오면 간에서 독성 물질(아세트알데히드)을 해독하느라 <b>함께 먹은 고기 지방의 산화 분해를 전면 중단하고 체지방으로 축적</b>시킵니다. 게다가 뇌의 식욕 중추를 자극해 배가 부른 상태에서도 고기를 끊임없이 집어먹게 만듭니다.</p>\n<p>2. <b>마무리 냉면과 볶음밥의 혈당 스파이크:</b> 이미 1,500kcal 이상을 섭취해 체내 글리코겐 저장고가 꽉 찬 상태에서 밀려 들어오는 정제 탄수화물은 혈중 포도당을 폭발시키고, 인슐린이 즉각 이 에너지를 복부 내장지방으로 저장합니다.</p>\n<p>3. <b>달콤짭짤한 쌈장과 양념장:</b> 쌈장 1~2큰술에는 생각보다 많은 액상과당과 정제당, 나트륨이 숨어 있어 수분 정체(부종)와 갈증을 유발합니다.</p>\n<h3>Point 04. 회식 자리에서 1,000kcal 줄이는 다이어터 생존 5원칙</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4: 생존 5원칙</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>그렇다면 회식을 거절할 수도 없는 직장인 다이어터는 어떻게 해야 할까요? <b>고기를 끊을 필요는 전혀 없습니다. 곁들이만 바꾸면 됩니다.</b></p>\n<p>다음 5가지 원칙만 기억하면 회식 자리 분위기를 전혀 해치지 않으면서 칼로리를 절반 가까이 줄일 수 있습니다:</p>\n<blockquote>**🛡️ 삼겹살집 다이어트 현실 생존 5원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **□ 채소부터 첫 입 먹기:** 상추, 깻잎, 파절이 등 식이섬유를 먼저 먹으면 장내 벽을 코팅하여 급격한 혈당 스파이크를 막고 과식을 방지합니다.</blockquote>\n<blockquote>2. **□ 소주는 딱 '반 병' 룰 (물 1:1 법칙):** 술 한 잔을 마실 때마다 물 한 컵을 반드시 마십니다. 알코올 분해를 돕고 음주량을 절반으로 줄여줍니다.</blockquote>\n<blockquote>3. **□ 마무리 냉면·볶음밥은 과감히 생략:** 이미 고기로 충분한 단백질을 채웠습니다. 탄수화물 마무리만 건너뛰어도 **500~700kcal가 즉시 절약**됩니다.</blockquote>\n<blockquote>4. **□ 쌈장 대신 소금·생와사비·명이나물:** 당분이 많은 쌈장 대신 고기 본연의 맛을 살리는 기름 없는 소금이나 생와사비를 곁들입니다.</blockquote>\n<blockquote>5. **□ 하루 총량으로 멘탈 관리:** 만약 오늘 어쩔 수 없이 과식을 했다면, 자책하지 말고 **다음 날 첫 끼를 가벼운 샐러드나 공복 유지**로 총량을 조절하세요.</blockquote>\n<h3>Point 05. 요약 & 다음 편 예고</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5: 요약</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>오늘의 핵심 결론은 단 하나입니다.</p>\n<blockquote>**\"고기를 줄이지 말고, 곁들이를 줄여라!\"**</blockquote>\n<p>다이어트는 맛있는 음식을 무조건 참는 고통의 과정이 아닙니다. 무엇이 진짜 살을 찌게 만드는지 정확한 영양 팩트를 알고, 현명하게 골라 먹는 기술입니다.</p>\n<p><b>📢 다음 편 예고:</b></p>\n<p>외식 가이드 2편에서는 대한민국 국민 야식 1위, <b>\"치킨, 다이어트 중에 먹어도 될까? (구운치킨 vs 튀긴치킨 vs 양념소스의 진실)\"</b> 편으로 돌아옵니다. 기대해 주세요!</p>\n<p>---</p>\n<h2>💬 여러분의 삼겹살집 외식 스타일은?</h2>\n<p>여러분은 삼겹살집에 가면 마무리로 보통 어떤 메뉴를 드시나요?</p>\n<p>시원한 <b>물냉면파</b>인가요, 아니면 불판 위에 볶아먹는 <b>볶음밥파</b>인가요? 여러분만의 외식 꿀팁이나 고민을 댓글로 자유롭게 남겨주세요! 😊</p>\n<p>오늘 정리해 드린 정보가 유익하셨다면 <b>[공감 ❤️]</b> 버튼과 <b>[이웃추가]</b>를 눌러주세요. 다음 편 팩트체크도 놓치지 않고 받아보실 수 있습니다!</p>\n<p>---</p>\n<h3>📚 참고 문헌 및 영양 공인 출처</h3>\n<p style='margin-left: 16px;'>• **식품의약품안전처 식품영양성분 데이터베이스** (삼겹살 구이, 소주, 물냉면 칼로리 기준)</p>\n<p style='margin-left: 16px;'>• **보건복지부 / 한국영양학회** 한국인 영양소 섭취기준 (성인 1일 에너지 권장량 2,000~2,500 kcal)</p>\n<p style='margin-left: 16px;'>• **SnapCalorie & Nutritionix** 육류 및 주류 열량 영양 분석 연구 데이터</p>\n<p>*본 포스팅은 공인 식품영양 데이터 및 학술 자료를 바탕으로 작성된 건강 정보 제공 목적의 콘텐츠이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #치킨칼로리 #치맥칼로리 #양념치킨당류 #치킨나트륨 #다이어트치킨 #외식다이어트 #프랜차이즈치킨 #치킨한마리칼로리 #삼겹살칼로리 #회식다이어트 #소주칼로리 #삼겹살냉면 #회식생존 #직장인다이어트 #체중감량 #유지어터 #고기다이어트 #칼로리조절 #건강식단 #다이어트꿀팁</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-인공감미료-세대전이-연구", "data": 고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\n감미료가 자식 세대까지 영향? · 그 연구가 진짜 말한 것과 말하지 않은 것\n\n수크랄로스·스테비아가 다음 세대까지 영향을 줄 수 있다는 연구가 보도되며 불안이 커졌습니다. 겁먹기 전에, 연구가 실제로 무엇을 밝혔는지 정확히 짚어봅니다.\n\n### 《연구가 말한 것》\n\n- **칠레대 연구팀이 암수 생쥐 47마리를 물·수크랄로스·스테비아 세 집단으로 나눠 사람 섭취량 수준으로 투여**\n\n- **감미료 섭취 집단은 장내미생물 다양성은 높아졌지만 단쇄지방산(SCFA) 농도는 낮아짐**\n\n- **1세대에선 수크랄로스 섭취 생쥐의 수컷 자손에서 포도당 내성 손상 징후, 2세대에선 수크랄로스 수컷·스테비아 암컷 자손에서 공복 혈당 상승**\n\n- **수크랄로스는 염증·대사 관련 유전자 발현 변화가 2세대까지 지속, 스테비아는 영향이 더 약함**\n\n- **국제학술지 Frontiers in Nutrition 게재(2026년 4월 10일)**\n\n### 《연구가 말하지 않은 것》\n\n- **이 실험은 사람이 아닌 생쥐 대상 동물실험으로, 결과를 사람에게 그대로 적용할 수 없습니다**\n\n- **원 보도도 \"우려\", \"가능성\", \"할 수 있다\" 등 신중한 표현을 썼고 감미료가 위험하다고 단정하지 않았습니다**\n\n- **감미료 반응은 개인차가 있습니다**\n\n### 《오늘의 행동 가이드》\n\n- **기사 제목만 보고 겁먹기보다, 제품 뒤 성분표에서 수크랄로스·스테비아 등 감미료 표기를 한 번 확인해보세요**\n\n- **제로 음료를 물처럼 마셔왔다면 하루 섭취 빈도를 스스로 한 번 점검해보는 것으로 충분합니다**\n\n### 《참고》\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다. 임신·수유·기저질환이 있다면 전문가와 상담하세요.**\n\n지금 저장해두고 제로 음료 자주 마시는 분에게 공유해주세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #인공감미료 #수크랄로스 #스테비아 #제로음료 #장내미생물 #단쇄지방산 #세대전이 #동물실험 #인슐린저항성 #공복혈당 #팩트체크 #칠레대 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단", "app_md": "# [앱게시판] 칠레대 연구팀이 수크랄로스·스테비아가 생쥐의 장내미생물·단쇄지방산을 바꿔 혈당·인슐린 지표에 영향을 주고 그 변화가 2세대까지 이어졌다고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설(연구가 말한 것 vs 말하지 않은 것) 칼 `, `장내미생물`, `단쇄지방산`, `세대전이`, `동물실험`, `인슐린 저항성`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** 칠레대 연구팀이 수크랄로스·스테비아가 생쥐의 장내미생물·단쇄지방산을 바꿔 혈당·인슐린 지표에 영향을 주고 그 변화가 2세대까지 이어졌다고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.</p>\n<p>---</p>\n<h2>🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"</h2>\n<p>다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.</p>\n<p>하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.</p>\n<p>과연 <b>칠레대 연구팀이 수크랄로스·스테비아가 생쥐의 장내미생물·단쇄지방산을 바꿔 혈당·인슐린 지표에 영향을 주고 그 변화가 2세대까지 이어졌다고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설</b>의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.</p>\n<p>---</p>\n<h2>📊 핵심 팩트 카드뉴스</h2>\n<h3>Point 01. 칠레대 연구팀이 수크랄로스·스테비아가 생쥐의 장내미생물·단쇄지방산을 바꿔 혈당·인슐린 지표에 영향을 주고 그 변화가 2세대까지 이어졌다고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설 공식 발표 및 핵심 요약</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 02. 칠레대 연구팀이 수크랄로스·스테비아가 생쥐의 장내미생물·단쇄지방산을 바꿔 혈당·인슐린 지표에 영향을 주고 그 변화가 2세대까지 이어졌다고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설 세부 권고 사항 및 영양 팩트</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 03. 칠레대 연구팀이 수크랄로스·스테비아가 생쥐의 장내미생물·단쇄지방산을 바꿔 혈당·인슐린 지표에 영향을 주고 그 변화가 2세대까지 이어졌다고 발표한 연구를 '동물실험'이라는 전제 아래 정확히 해설 다이어터가 주의해야 할 점</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<h2>💡 상세 분석 및 과학적 팩트체크</h2>\n<p>감미료가 자식 세대까지 영향? · 그 연구가 진짜 말한 것과 말하지 않은 것</p>\n<p>수크랄로스·스테비아가 다음 세대까지 영향을 줄 수 있다는 연구가 보도되며 불안이 커졌습니다. 겁먹기 전에, 연구가 실제로 무엇을 밝혔는지 정확히 짚어봅니다.</p>\n<h3>《연구가 말한 것》</h3>\n<p style='margin-left: 16px;'>• **칠레대 연구팀이 암수 생쥐 47마리를 물·수크랄로스·스테비아 세 집단으로 나눠 사람 섭취량 수준으로 투여**</p>\n<p style='margin-left: 16px;'>• **감미료 섭취 집단은 장내미생물 다양성은 높아졌지만 단쇄지방산(SCFA) 농도는 낮아짐**</p>\n<p style='margin-left: 16px;'>• **1세대에선 수크랄로스 섭취 생쥐의 수컷 자손에서 포도당 내성 손상 징후, 2세대에선 수크랄로스 수컷·스테비아 암컷 자손에서 공복 혈당 상승**</p>\n<p style='margin-left: 16px;'>• **수크랄로스는 염증·대사 관련 유전자 발현 변화가 2세대까지 지속, 스테비아는 영향이 더 약함**</p>\n<p style='margin-left: 16px;'>• **국제학술지 Frontiers in Nutrition 게재(2026년 4월 10일)**</p>\n<h3>《연구가 말하지 않은 것》</h3>\n<p style='margin-left: 16px;'>• **이 실험은 사람이 아닌 생쥐 대상 동물실험으로, 결과를 사람에게 그대로 적용할 수 없습니다**</p>\n<p style='margin-left: 16px;'>• **원 보도도 \"우려\", \"가능성\", \"할 수 있다\" 등 신중한 표현을 썼고 감미료가 위험하다고 단정하지 않았습니다**</p>\n<p style='margin-left: 16px;'>• **감미료 반응은 개인차가 있습니다**</p>\n<h3>《오늘의 행동 가이드》</h3>\n<p style='margin-left: 16px;'>• **기사 제목만 보고 겁먹기보다, 제품 뒤 성분표에서 수크랄로스·스테비아 등 감미료 표기를 한 번 확인해보세요**</p>\n<p style='margin-left: 16px;'>• **제로 음료를 물처럼 마셔왔다면 하루 섭취 빈도를 스스로 한 번 점검해보는 것으로 충분합니다**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다. 임신·수유·기저질환이 있다면 전문가와 상담하세요.**</p>\n<p>지금 저장해두고 제로 음료 자주 마시는 분에게 공유해주세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #인공감미료 #수크랄로스 #스테비아 #제로음료 #장내미생물 #단쇄지방산 #세대전이 #동물실험 #인슐린저항성 #공복혈당 #팩트체크 #칠레대 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-그릭요거트-당류-10배", "data": {"folder": "20260705-그릭요거트-당류-10배", "blog_md": "# [그릭요거트] 소비자시민모임의 시중 그릭요거트 17종 시험·평가 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분 재료명에서 '알룰로스'인지 '~리톨' 계열(당알코올)인지 확인하세요**\n\n### 《참고》\n\n- **감미료의 효과·안전성은 관찰·동물연구 등에 기반한 분석·보고로, 개인차가 있습니다**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**\n\n지금 저장해두고 제로 즐겨 먹는 친구에게 공유해주세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #알룰로스 #당알코올 #희소당 #에리스리톨 #말티톨 #자일리톨 #대체감미료 #혈당지수 #성분표원재료명 #복부팽만 #다이어트감미료 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단", "app_md": "# [앱게시판] 둘 다 '제로'로 팔리지만 몸속 경로가 다른 알룰로스(희소당)와 당알코올(에리스리톨·말티톨·자일리톨 등)의 차이, 그리고 성분표에서 구분하는 법 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n둘 다 '제로'로 팔리지만 몸속 경로가 다른 알룰로스(희소당)와 당알코올(에리스리톨·말티톨·자일리톨 등)의 차이, 그리고 성분표에서 구분하는 법 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n둘 다 '제로'로 팔리지만 몸속 경로가 다른 알룰로스(희소당)와 당알코올(에리스리톨·말티톨·자일리톨 등)의 차이, 그리고 성분표에서 구분하는 법에 대한 영양 팩트체크 정보입니다.\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#알룰로스 #당알코올 #희소당 #에리스리톨\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 둘 다 '제로'로 팔리지만 몸속 경로가 다른 알룰로스(희소당)와 당알코올(에리스리톨·말티톨·자일리톨 등)의 차이, 그리고 성분표에서 구분하는 법 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 둘 다 '제로'로 팔리지만 몸속 경로가 다른 알룰로스(희소당)와 당알코올(에리스리톨·말티톨·자일리톨 등)의 차이, 그리고 성분표에서 구분하는 법 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[알룰로스] 둘 다 '제로'로 팔리지만 몸속 경로가 다른 알룰로스와 당알코올의 차이, 그리고 성분표에서 구분하는 법 — 다이어터가 매일 마시던 제로의 진실</h1>\n<blockquote>**작성일:** 2026-07-05</blockquote>\n<blockquote>**콘텐츠 허브:** `@dessrt 이미지 2](이미지-02-본문.png)\n\n### Point 03. 국민 6명 중 1명이 당 과잉섭취 상태로 나타난 가운데 국회에서 가당음료 부담금 법안이 발의돼 논의 중인 사안 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\n국민 6명 중 1명 당 과잉섭취 · 설탕세(가당음료 부담금) 논의, 어디까지 왔나\n\n질병관리청 국민건강영양조사(2023)에서 국민 16.9%, 약 6명 중 1명이 당 과잉섭취 상태로 나타났습니다. 국회에서는 가당음료 부담금, 이른바 설탕세 법안이 발의돼 논의 중입니다.\n\n### 《핵심 수치》\n\n- **당 과잉섭취자 16.9% (총 에너지 중 당 섭취 비율 20% 초과 기준)**\n\n- **1~9세 26.7%로 전 연령 최고, 10~18세 17.4%, 19~29세 17.0%**\n\n- **부담금안: 100mL당 당 5g 미만 면제 / 5~8g 리터당 225원 / 8g 이상 리터당 300원**\n\n### 《찬성 쪽 근거》\n\n- **영국이 2018년 도입한 뒤 음료 당 함량 저감이 보고됐고, 보도 기준 세계 120여개국이 유사 제도를 운영**\n\n- **확보 재원을 건강 증진에 투입할 수 있다는 주장**\n\n### 《반대 쪽 근거》\n\n- **업계가 자율적으로 당류를 줄이는 중에 강제 규제는 과하다는 지적**\n\n- **음료값 인상에 따른 물가 부담, 저소득층에 더 무겁다는 역진성 우려**\n\n### 《참고》\n\n- **발의·논의 단계로, 확정된 제도가 아닙니다**\n\n- **설탕세가 비만을 해결한다고 단정된 것도 아니며, 효과 수치는 연구·집계마다 차이가 있습니다**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다. 적정 섭취량은 개인차가 있습니다**\n\n제도와 무관하게 오늘 할 수 있는 것 하나. 음료 뒷면 영양성분표에서 당류 g을 확인하세요. WHO 권고는 하루 50g 미만입니다.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #설탕세 #가당음료부담금 #당과잉섭취 #질병관리청 #국민건강영양조사 #국민건강증진법 #영국설탕세 #당류저감 #비만 #영양성분표 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁", "app_md": "# [앱게시판] 국민 6명 중 1명(16.9%)이 당 과잉섭취 상태로 나타난 가운데 국회에서 가당음료 부담금(설탕세) 법안이 발의돼 논의 중인 사안 — 찬반 양측 병기, 확정 아닌 논의 단계임을 명시 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n국민 6명 중 1명(16.9%)이 당 과잉섭취 상태로 나타난 가운데 국회에서 다**</p>\n<p>제도와 무관하게 오늘 할 수 있는 것 하나. 음료 뒷면 영양성분표에서 당류 g을 확인하세요. WHO 권고는 하루 50g 미만입니다.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #설탕세 #가당음료부담금 #당과잉섭취 #질병관리청 #국민건강영양조사 #국민건강증진법 #영국설탕세 #당류저감 #비만 #영양성분표 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-제로소주-열량", "data": {"folder": "20260705-제로소주-열량", "blog_md": "# [제로슈거 소주] 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크\n\n---\n\n## 🔍 1. 사전 팩트체크 검증 개요\n\n| 검증 항목 | 공인 기관 및 발표 자료 | 핵심 팩트 요약 |\n|---|---|---|\n| **주제 팩트** | WHO / 식약처 공식 가이드라인 | 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크 관련 권고 및 연구 발표 원문 검증 |\n| **다이어트 영향** | 체계적 문헌고찰 (Systematic Review) | 인공감미료 장기 섭취 시 체지방 감량 효과 미확인 |\n| **건강 리스크** | 관찰 연구 및 대사질환 지표 | 당뇨 환자 외 일반인의 무분별한 과다 섭취 주의 필요 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `제로슈거 소주`\n- **연관 키워드:** `소주 열량`, `한국소비자원`, `알코올 열량`, `당류`, `무설탕`, `알코올 도수`, `다이어트`\n- **독자 검색 의도:** 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연 in-left: 16px;'>• **연관 키워드:** `소주 열량`, `한국소비자원`, `알코올 열량`, `당류`, `무설탕`, `알코올 도수`, `다이어트`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.</p>\n<p>---</p>\n<h2>🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"</h2>\n<p>다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.</p>\n<p>하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.</p>\n<p>과연 <b>한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크</b>의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.</p>\n<p>---</p>\n<h2>📊 핵심 팩트 카드뉴스</h2>\n<h3>Point 01. 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크 공식 발표 및 핵심 요약</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 02. 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크 세부 권고 사항 및 영양 팩트</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 03. 한국소비자원 조사 결과 제로슈거 소주의 열량이 일반 소주와 거의 차이 없는 이유와 소비자 인식 괴리 팩트체크 다이어터가 주의해야 할 점</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<h2>💡 상세 분석 및 과학적 팩트체크</h2>\n<p>설탕 뺐는데 열량은 그대로 · 제로슈거 소주의 진짜 열량, 소비자원이 재봤다</p>\n<p>제로슈거 소주와 일반 소주의 열량 차이, 생각보다 훨씬 작았습니다.</p>\n<h3>《핵심 수치》</h3>\n<p style='margin-left: 16px;'>• **한국소비자원이 제로슈거 표시 소주 5종과 일반 소주 비교**</p>\n<p style='margin-left: 16px;'>• **열량 차이는 100mL당 2.6~14.7kcal 수준**</p>\n<p style='margin-left: 16px;'>• **제로슈거 소주는 알코올 도수가 0.5~2.6도 낮아, 도수를 감안하면 사실상 비슷**</p>\n<p style='margin-left: 16px;'>• **소주 열량의 대부분은 당이 아니라 알코올(1g당 7kcal)**</p>\n<h3>《의외의 사실》</h3>\n<p style='margin-left: 16px;'>• **일반 소주도 당류가 100mL당 평균 0.12g으로 원래 낮은 수준**</p>\n<p style='margin-left: 16px;'>• **설문에서는 제로슈거 소주 구매 이유 1위가 \"열량이 낮아서\"(40.4%)로 실제와 인식의 차이가 컸습니다**</p>\n<h3>《행동 가이드》</h3>\n<p style='margin-left: 16px;'>• **술 열량은 도수와 마시는 양이 정합니다. 라벨에서 알코올 도수와 용량을 확인하세요**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **수치는 한국소비자원 조사 등 공개 자료 기준이며 제품별로 차이가 있을 수 있습니다**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**</p>\n<p style='margin-left: 16px;'>• **지나친 음주는 건강에 해롭습니다**</p>\n<p>지금 저장해두고 다음 장보기 때 확인해보세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #제로슈거소주 #소주열량 #한국소비자원 #알코올열량 #당류 #알코올도수 #다이어트 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁 #유지어터 #영양성분표 #성분분석</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-하루-첨가당-섭취량", "data": {"folder": "20260705-하루-첨가당-섭취량", "blog_md": "# [첨가당] WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크\n\n---\n\n## 🔍 1. 사전 팩트체크 검증 개요\n\n| 검증 항목 | 공인 기관 및 발표 자료 | 핵심 팩트 요약 |\n|---|---|---|\n| **주제 팩트** | WHO / 식약처 공식 가이드라인 | WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 관련 권고 및 연구 발표 원문 검증 |\n| **다이어트 영향** | 체계적 문헌고찰 (Systematic Review) | 인공감미료 장기 섭취 시 체지방 감량 효과 미확인 |\n| **건강 리스크** | 관찰 연구 및 대사질환 지표 | 당뇨 환자 외 일반인의 무분별한 과다 섭취 주의 필요 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `첨가당`\n- **연관 키워드:** `자유당`, `WHO 권고`, `하루 당류 섭취량`, `2025 한국인 영양소 섭취기준`, `가당음료`, `각설탕 환산`, `영양성분표`, `당류 저감`\n- **독자 검색 의도:** WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.\n\n---\n\n## 🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"\n\n다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.\n\n하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.\n\n과연 **WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크**의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.\n\n---\n\n## 📊 핵심 팩트 카드뉴스\n\n### Point 01. WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 공식 발표 및 핵심 요약\n\n![팩트체크 이미지 1](이미지-01-썸네일.png)\n\n### Point 02. WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 세부 권고 사항 및 영양 팩트\n\n![팩트체크 이미지 2](이미지-02-본문.png)\n\n### Point 03. WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\n하루 당류 얼마까지 괜찮을까 · WHO 권고 50g, 한국인 평균은 57.2g\n\nWHO는 첨가당 등 자유당을 하루 총열량의 10% 미만으로 제한하라고 권고합니다. 2000kcal 기준 약 50g, 각설탕(3g)으로 약 17개입니다.\n\n### 《핵심 수치》\n\n- **WHO 권고: 자유당(첨가당·꿀·시럽·과일주스 당) 하루 총열량의 10% 미만(약 50g), 추가 이득을 위해 5%(약 25g) 이하 조건부 제안**\n\n- **2025 한국인 영양소 섭취기준(보건복지부): 첨가당 '10% 이내로 제한한다'로 표현 강화, 총당류는 20% 이내**\n\n- **'첨가당의 주요 급원인 가당음료의 섭취는 가능한 줄인다' 문구 신설**\n\n- **2024년 국민건강영양조사 기준 한국인 하루 총당류 57.2g, 10~18세 청소년은 64.7g으로 보도**\n\n### 《헷갈리기 쉬운 것》\n\n- **57.2g은 과일·우유의 천연당까지 포함한 '총당류'**\n\n- **WHO 50g은 첨가당 중심의 '자유당' 기준이라 두 숫자의 직접 비교에는 한계가 있습니다**\n\n- **식약처 분석(2018~2022)에서 가공식품 유래 당류는 평균 총열량의 7.6%로 WHO 기준 이내였지만, 6~18세 어린이·청소년은 3명 중 1명이 기준을 초과했습니다**\n\n### 《오늘 할 일》\n\n- **음료 영양성분표에서 '당류 g'을 확인하고 하루 50g과 비교해보세요**\n\n### 《참고》\n\n- **적정 섭취량은 활동량·건강 상태에 따라 개인차가 있습니다**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**\n\n저장해두고 장 볼 때 꺼내 보세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #첨가당 #자유당 #WHO권고 #하루당류섭취량 #2025한국인영양소섭취기준 #가당음료 #각설탕환산 #영양성분표 #당류저감 #국민건강영양조사 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #체중조절 #건강식단 #다이어트꿀팁 #유지어터", "app_md": "# [앱게시판] WHO·2025 한국인 영양소 섭취기준의 하루 첨가당(자유당) 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 칼로리 팩트체크\n\n## 1. 게시판 제목\n\nWHO·2025 한국인 영양소 섭취기준의 하루 첨가당(자유당) 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\nWHO·2025 한국인 영양소 섭취기준의 하루 첨가당(자유당) 권고량과 한국인의 실제 당류 섭취 실태 팩트체크에 대한 영양 팩트체크 정보입니다.\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#첨가당 #자유당 #WHO 권고 #하루 당류 섭취량\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** WHO·2025 한국인 영양소 섭취기준의 하루 첨가당(자유당) 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** WHO·2025 한국인 영양소 섭취기준의 하루 첨가당(자유당) 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[첨가당] WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 — 다이어터가 매일 마시던 제로의 진실</h1>\n<blockquote>**작성일:** 2026-07-05</blockquote>\n<blockquote>**콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**주제 분석:** WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 검증 개요</h2>\n<table>\n<tr><th>검증 항목</th><th>공인 기관 및 발표 자료</th><th>핵심 팩트 요약</th></tr>\n<tr><td>**주제 팩트**</td><td>WHO / 식약처 공식 가이드라인</td><td>WHO·2025 한국인 영양소 섭취기준의 하루 첨가당 권고량과 한국인의 실제 당류 섭취 실태 팩트체크 관련 권고 및 연구 발표 원문 검증</td></tr>\n<tr><td>**다이어트 영향**</td><td>체계적 문헌고찰 (Sys *</p>\n<p style='margin-left: 16px;'>• **2024년 국민건강영양조사 기준 한국인 하루 총당류 57.2g, 10~18세 청소년은 64.7g으로 보도**</p>\n<h3>《헷갈리기 쉬운 것》</h3>\n<p style='margin-left: 16px;'>• **57.2g은 과일·우유의 천연당까지 포함한 '총당류'**</p>\n<p style='margin-left: 16px;'>• **WHO 50g은 첨가당 중심의 '자유당' 기준이라 두 숫자의 직접 비교에는 한계가 있습니다**</p>\n<p style='margin-left: 16px;'>• **식약처 분석(2018~2022)에서 가공식품 유래 당류는 평균 총열량의 7.6%로 WHO 기준 이내였지만, 6~18세 어린이·청소년은 3명 중 1명이 기준을 초과했습니다**</p>\n<h3>《오늘 할 일》</h3>\n<p style='margin-left: 16px;'>• **음료 영양성분표에서 '당류 g'을 확인하고 하루 50g과 비교해보세요**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **적정 섭취량은 활동량·건강 상태에 따라 개인차가 있습니다**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**</p>\n<p>저장해두고 장 볼 때 꺼내 보세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #첨가당 #자유당 #WHO권고 #하루당류섭취량 #2025한국인영양소섭취기준 #가당음료 #각설탕환산 #영양성분표 #당류저감 #국민건강영양조사 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #체중조절 #건강식단 #다이어트꿀팁 #유지어터</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-수크랄로스-혈당-식욕", "data": {"folder": "20260705-수크랄로스-혈당-식욕", "blog_md": "# [수크랄로스] 수크랄로스가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** 수크 \n\n### 《오늘 할 수 있는 것》\n\n- **제로음료를 마신 뒤 내 허기·식욕이 어떻게 변하는지 스스로 관찰해보기**\n\n- **단맛에 얼마나 의존하는지 하루 섭취를 한번 점검해보기**\n\n### 《참고》\n\n- **식욕 연구는 표본 75명의 소규모 결과로 후속 검증이 필요한 진행형입니다. \"수크랄로스가 살찌게 한다\"는 단정이 아니라 연구 결과로 이해해주세요. 개인차가 있습니다.**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다.**\n\n지금 저장해두고 제로음료 즐기는 친구에게 공유해주세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #수크랄로스 #비당류감미료 #인공감미료 #제로음료 #식후혈당 #인슐린반응 #시상하부 #식욕 #배고픔 #메타분석 #다이어트 #팩트체크 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단", "app_md": "# [앱게시판] 수크랄로스(비당류 감미료)가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n수크랄로스(비당류 감미료)가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n수크랄로스(비당류 감미료)가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁에 대한 영양 팩트체크 정보입니다.\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#수크랄로스 #비당류 감미료 #인공감미료 #제로음료\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 수크랄로스(비당류 감미료)가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 수크랄로스(비당류 감미료)가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[수크랄로스] 수크랄로스가 혈당에는 영향이 없다는 메타분석과, 식욕·시상하부 활동을 자극한다는 뇌 연구가 엇갈리는 진행형 논쟁 — 다이어터가 매일 마시던 제로의 진실</h1> 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<h2>💡 상세 분석 및 과학적 팩트체크</h2>\n<p>혈당엔 무관 식욕엔 영향 · 수크랄로스 연구가 엇갈리는 이유</p>\n<p>수크랄로스가 혈당을 올리지 않는다는 연구와, 식욕을 자극한다는 연구가 나란히 나왔습니다. 어느 쪽이 맞는지 정리했습니다.</p>\n<h3>《혈당엔 무관하다는 쪽》</h3>\n<p style='margin-left: 16px;'>• **캐나다 토론토 마이클스병원, 국제학술지 Nutrients 2023**</p>\n<p style='margin-left: 16px;'>• **임상시험 36건 메타분석**</p>\n<p style='margin-left: 16px;'>• **비당류 감미료 음료 단독 섭취 시 식후 혈당·인슐린 반응이 물과 유사**</p>\n<h3>《식욕엔 영향 있다는 쪽》</h3>\n<p style='margin-left: 16px;'>• **미국 서던캘리포니아대, 국제학술지 Nature Metabolism 2025**</p>\n<p style='margin-left: 16px;'>• **성인 75명 뇌 스캔 임상시험**</p>\n<p style='margin-left: 16px;'>• **수크랄로스 물이 식욕·체중 조절 영역인 시상하부 활동을 높임**</p>\n<p style='margin-left: 16px;'>• **효과는 비만인에게서 가장 강하게 나타남**</p>\n<h3>《공통점》</h3>\n<p style='margin-left: 16px;'>• **두 연구 모두 인공감미료가 혈당 올리는 호르몬에는 큰 영향이 없다는 데는 일치**</p>\n<h3>《오늘 할 수 있는 것》</h3>\n<p style='margin-left: 16px;'>• **제로음료를 마신 뒤 내 허기·식욕이 어떻게 변하는지 스스로 관찰해보기**</p>\n<p style='margin-left: 16px;'>• **단맛에 얼마나 의존하는지 하루 섭취를 한번 점검해보기**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **식욕 연구는 표본 75명의 소규모 결과로 후속 검증이 필요한 진행형입니다. \"수크랄로스가 살찌게 한다\"는 단정이 아니라 연구 결과로 이해해주세요. 개인차가 있습니다.**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다.**</p>\n<p>지금 저장해두고 제로음료 즐기는 친구에게 공유해주세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 면 성분표에서 당알코올 종류와 함량(g)을 확인하세요\n\n2. 무설탕 초콜릿·캔디는 한 번에 다 먹지 말고 나눠 드세요\n\n3. 당뇨가 있다면 말티톨 함유 제품의 혈당 영향을 감안하세요\n\n### 《참고》\n\n- **끊으라는 이야기가 아닙니다. 양과 성분을 확인하자는 이야기입니다**\n\n- **부작용 발생량은 개인차가 큽니다**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**\n\n다음 장보기 전에 저장해두세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #당알코올 #말티톨 #혈당지수 #GI #설사 #복부팽만 #성분표 #식약처 #무설탕초콜릿 #대체당 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁", "app_md": "# [앱게시판] 무설탕 디저트의 당알코올(말티톨 등) — 성인 하루 40~50g 이상 섭취 시 설사·복부팽만 가능, 말티톨은 GI 36으로 혈당도 올린다는 팩트체크와 성분표 확인 행동 가이드 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n무설탕 디저트의 당알코올(말티톨 등) — 성인 하루 40~50g 이상 섭취 시 설사·복부팽만 가능, 말티톨은 GI 36으로 혈당도 올린다는 팩트체크와 성분표 확인 행동 가이드 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n무설탕 디저트의 당알코올(말티톨 등) — 성인 하루 40~50g 이상 섭취 시 설사·복부팽만 가능, 말티톨은 GI 36으로 혈당도 올린다는 팩트체크와 성분표 확인 행동 가이드에 대한 영양 팩트체크 정보입니다.\n\n[핵심 실천 수칙]\n□ - 타겟: 20~40대 다이어터 (보조: 당뇨·심혈관 가족력, 장트러블·IBS, 헬스장 이용자)\n□ - 플랫폼: 인스타그램·유튜브·틱톡·스레드·X\n□ - 톤: 균형 잡힌 팩트체크 / 공포 조장 금지 / \"끊어라\"가 아니라 \"양과 성분을 확인하라\"\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#당알코올 #말티톨 #무설탕 #제로슈거\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 무설탕 디저트의 당알코올(말티톨 등) — 성인 하루 40~50g 이상 섭취 시 설사·복부팽만 가능, 말티톨은 GI 36으로 혈당도 올린다는 팩트체크와 성분표 확인 행동 가이드 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 무설탕 디저트의 당알코올(말티톨 등) — 성인 하루 40~50g 이상 섭취 시 설사·복부팽만 가능, 말티톨은 GI 36으로 혈당도 올린다는 팩트체크와 성분표 확인 행동 가이드 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어 margin-left: 16px;'>• **한국식품연구원 연구 동향 기준, 성인 하루 40~50g 이상 섭취 시 복통 등 문제 가능성 (개인차 있음)**</p>\n<p style='margin-left: 16px;'>• **말티톨 GI 약 36, 설탕(GI 60대)의 절반이 넘는 수준으로 혈당 상승**</p>\n<p style='margin-left: 16px;'>• **식약처는 당알코올류 주요 원재료 제품에 \"과량 섭취 시 설사를 일으킬 수 있습니다\" 표시를 규정**</p>\n<h3>《오늘 할 일》</h3>\n<p>1. 제품 뒷면 성분표에서 당알코올 종류와 함량(g)을 확인하세요</p>\n<p>2. 무설탕 초콜릿·캔디는 한 번에 다 먹지 말고 나눠 드세요</p>\n<p>3. 당뇨가 있다면 말티톨 함유 제품의 혈당 영향을 감안하세요</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **끊으라는 이야기가 아닙니다. 양과 성분을 확인하자는 이야기입니다**</p>\n<p style='margin-left: 16px;'>• **부작용 발생량은 개인차가 큽니다**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**</p>\n<p>다음 장보기 전에 저장해두세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #당알코올 #말티톨 #혈당지수 #GI #설사 #복부팽만 #성분표 #식약처 #무설탕초콜릿 #대체당 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-아스파탐-발암논란-이후", "data": {"folder": "20260705-아스파탐-발암논란-이후", "blog_md": "# [아스파탐] 2023년 IARC의 아스파탐 2B군 분류의 실제 의미 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** 2023년 IARC의 아스파탐 2B군 분류의 실제 의미\n\n---\n\n## 🔍 1. 사전 팩트체크 검증 개요\n\n| 검증 항목 | 공인 기관 및 발표 자료 | 핵심 팩트 요약 |\n|---|---|---|\n| **주제 팩트** | WHO / 식약처 공식 가이드라인 | 2023년 IARC의 아스파탐 2B군 분류의 실제 의미 관련 권고 및 연구 발표 원문 검증 |\n| **다이어트 영향** | 체계적 문헌고찰 (Systematic Review) | 인공감미료 장기 섭취 시 체지방 감량 효과 미확인 |\n| **건강 리스크** | 관찰 연구 및 대사질환 지표 | 당뇨 환자 외 일반인의 무분별한 과다 섭취 주의 필요 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `아스파탐`\n- **연관 키워드:** `제로콜라`, `2B군`, `IARC`, `JECFA`, `일일섭취허용량(ADI)`, `식약처`, `발암 가능 물질`, `인공감미료`\n- **독자 검색 의도:** 2023년 IARC의 아스파탐 2B군 분류의 실제 의미에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.\n\n---\n\n## 🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"\n\n다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.\n\n하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.\n\n과연 **2023년 IARC의 아스파탐 2B군 분류의 실제 의미**의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.\n\n---\n\n## 📊 핵심 팩트 카드뉴스\n\n### Point 01. 2023년 IARC의 아스파탐 2B군 분류의 실제 의미 공식 발표 및 핵심 요약\n\n![팩트체크 이미지 1](이미지-01-썸네일.png)\n\n### Point 02. 2023년 IARC의 아스파탐 2B군 분류의 실제 의미 세부 권고 사항 및 영양 팩트\n\n![팩트체크 이미지 2](이미지-02-본문.png)\n\n### Point 03. 2023년 IARC의 아스파탐 2B군 분류의 실제 의미 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\n전자파와 같은 등급이었다 · 아스파탐 '발암 가능 물질' 분류, 확인된 사실\n\n2023년 WHO 산하 국제암연구소(IARC)가 아스파탐을 2B군으로 분류한 뒤 확인된 내용을 정리했습니다.\n\n### 《무슨 일이》\n\n- **2023년 7월 14일 IARC가 아스파탐을 2B군(인체 발암 가능 물질)으로 분류**\n\n- **2B군은 인체 관련 증거가 제한적일 때 부여되는 등급으로, 김치 등 절임채소류·휴대전화 전자파와 같은 군**\n\n- **참고로 1군은 술·가공육, 2A군은 65도 이상 뜨거운 음료·적색육**\n\n### 《허용량은 그대로》\n\n- **같은 날 JECFA는 1일 섭취허용량(체중 1kg당 40mg)을 유지하고 현 섭취 수준에서 안전성 우려가 없다고 평가**\n\n- **식약처도 현행 사용기준 유지**\n\n- **체중 60kg 성인 기준 제로콜라 250mL(아스파탐 43mg 함유 시) 하루 55캔을 마셔야 허용량에 도달**\n\n- **2019년 조사에서 국민 평균 아스파탐 섭취량은 허용량 대비 약 0.12%**\n\n### 《오늘 할 일》\n\n- **지금 마시는 음료 성분표(원재료명)에서 '아스파탐' 표기를 확인해보세요**\n\n### 《참고》\n\n- **허용량은 평균 기준으로 개인차가 있습니다**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**\n\n저장해두고 제로 음료 고를 때 참고하세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #아스파탐 #제로콜라 #2B군 #IARC #JECFA #일일섭취허용량ADI #식약처 #발암가능물질 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁 #유지어터 #영양성분표", "app_md": "# [앱게시판] 2023년 IARC의 아스파탐 2B군(인체 발암 가능) 분류의 실제 의미 — 등급 체계 해설과 1일 섭취허용량(하루 55캔 환산)의 크기 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n2023년 IARC의 아스파탐 2B군(인체 발암 가능) 분류의 실제 의미 — 등급 체계 해설과 1일 섭취허용량(하루 55캔 환산)의 크기 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n2023년 IARC의 아스파탐 2B군(인체 발암 가능) 분류의 실제 의미 — 등급 체계 해설과 1일 섭취허용량(하루 55캔 환산)의 크기에 대한 영양 팩트체크 정보입니다.\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#아스파탐 #제로콜라 #2B군 #IARC\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 2023년 IARC의 아스파탐 2B군(인체 발암 가능) 분류의 실제 의미 — 등급 체계 해설과 1일 섭취허용량(하루 55캔 환산)의 크기 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 2023년 IARC의 아스파탐 2B군(인체 발암 가능) 분류의 실제 의미 — 등급 체계 해설과 1일 섭취허용량(하루 55캔 환산)의 크기 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[아스파탐] 2023년 IARC의 아스파탐 2B군 분류의 실제 의미 — 다이어터가 매일 마시던 제로의 진실</h1>\n<blockquote>**작성일:** 2026-07-05</blockquote>\n<blockquote>**콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**주제 분석:** 2023년 IARC의 아스파탐 2B군 분류의 실제 의미</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 검증 개요</h2>\n<table>\n<tr><th>검증 항목</th><th>공인 기관 및 발표 자료</th><th>핵심 팩트 요약</th></tr>\n<tr><td>**주제 팩트**</td><td>WHO / 식약처 공식 가이드라인</td><td>2023년 IARC의 아스파탐 2B군 분류의 실제 의미 관련 권고 및 연구 발표 원문 검 left: 16px;'>• **식약처도 현행 사용기준 유지**</p>\n<p style='margin-left: 16px;'>• **체중 60kg 성인 기준 제로콜라 250mL(아스파탐 43mg 함유 시) 하루 55캔을 마셔야 허용량에 도달**</p>\n<p style='margin-left: 16px;'>• **2019년 조사에서 국민 평균 아스파탐 섭취량은 허용량 대비 약 0.12%**</p>\n<h3>《오늘 할 일》</h3>\n<p style='margin-left: 16px;'>• **지금 마시는 음료 성분표(원재료명)에서 '아스파탐' 표기를 확인해보세요**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **허용량은 평균 기준으로 개인차가 있습니다**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**</p>\n<p>저장해두고 제로 음료 고를 때 참고하세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #아스파탐 #제로콜라 #2B군 #IARC #JECFA #일일섭취허용량ADI #식약처 #발암가능물질 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁 #유지어터 #영양성분표</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-천연감미료-첨가당", "data": {"folder": "20260705-천연감미료-첨가당", "blog_md": "# [첨가당] 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크\n\n---\n\n## 🔍 1. 사전 팩트체크 검증 개요\n\n| 검증 항목 | 공인 기관 및 발표 자료 | 핵심 팩트 요약 |\n|---|---|---|\n| **주제 팩트** | WHO / 식약처 공식 가이드라인 | 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 관련 권고 및 연구 발표 원문 검증 |\n| **다이어트 영향** | 체계적 문헌고찰 (Systematic Review) | 인공감미료 장기 섭취 시 체지방 감량 효과 미확인 |\n| **건강 리스크** | 관찰 연구 및 대사질환 지표 | 당뇨 환자 외 일반인의 무분별한 과다 섭취 주의 필요 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `첨가당`\n- **연관 키워드:** `천연 감미료`, `아가베시럽`, `메이플시럽`, `코코넛슈거`, `GI(혈당지수)`, `당류 섭취 권고`, `성분표`\n- **독자 검색 의도:** 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.\n\n---\n\n## 🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"\n\n다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.\n\n하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.\n\n과연 **꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크**의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.\n\n---\n\n## 📊 핵심 팩트 카드뉴스\n\n### Point 01. 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 공식 발표 및 핵심 요약\n\n![팩트체크 이미지 1](이미지-01-썸네일.png)\n\n### Point 02. 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 세부 권고 사항 및 영양 팩트\n\n![팩트체크 이미지 2](이미지-02-본문.png)\n\n### Point 03. 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\n꿀도 결국 설탕이다 · 천연 감미료 첨가당 팩트체크\n\n설탕 대신 꿀·아가베시럽·코코넛슈거를 고르는 분들 많죠. 몸속에서는 어떻게 다를까요.\n\n### 《핵심 팩트》\n\n- **미 브리검영대 카렌 델라 코르테 교수 \"당이 꿀에서 오든 설탕에서 오든 결국 포도당·과당으로 분해된다\"**\n\n- **꿀·메이플시럽·아가베시럽도 식품에 첨가되면 모두 '첨가당'**\n\n- **코코넛슈거의 GI(혈당지수)·칼로리는 흰 설탕과 비슷한 수준**\n\n- **50g 기준 열량은 설탕 약 197kcal·꿀 약 162kcal·메이플시럽 약 130kcal로 보도됐지만, 다소 낮아도 첨가당인 것은 같습니다**\n\n### 《얼마나 먹어도 될까》\n\n- **WHO는 유리당을 하루 총열량의 10% 미만(약 50g), 5%(약 25g)면 더 이롭다고 권고**\n\n- **미국심장협회는 하루 남성 36g·여성 25g 이하 권고**\n\n- **권장량과 신체 반응에는 개인차가 있습니다**\n\n### 《오늘 할 일》\n\n- **성분표에서 당류(g) 합계를 확인하고, 꿀·시럽도 그 총량 안에 포함해 계산하세요**\n\n### 《참고》\n\n- **미량 영양소 차이는 있으나 '건강식품'이라 볼 근거는 아닙니다**\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**\n\n저장해두고 장 볼 때 꺼내 보세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #첨가당 #천연감미료 #아가베시럽 #메이플시럽 #코코넛슈거 #GI혈당지수 #당류섭취권고 #성분표 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁 #유지어터 #영양성분표", "app_md": "# [앱게시판] 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크에 대한 영양 팩트체크 정보입니다.\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#첨가당 #천연 감미료 #아가베시럽 #메이플시럽\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[첨가당] 꿀·아가베시럽·메이플시럽·코코넛슈거 등 '천연 감미료'도 식품에 첨가되면 모두 첨가당이며, 흰 설탕 대비 건강상 이점이 크지 않다는 팩트체크 — 다이어터가 매일 마시던 제로의 진실</h1>\n<blockquote>**작성일:** 2026-07-05</blockquote>\n<blockquote>**콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**주제 분석:** 꿀·아가베시럽 \n<h2>💡 상세 분석 및 과학적 팩트체크</h2>\n<p>꿀도 결국 설탕이다 · 천연 감미료 첨가당 팩트체크</p>\n<p>설탕 대신 꿀·아가베시럽·코코넛슈거를 고르는 분들 많죠. 몸속에서는 어떻게 다를까요.</p>\n<h3>《핵심 팩트》</h3>\n<p style='margin-left: 16px;'>• **미 브리검영대 카렌 델라 코르테 교수 \"당이 꿀에서 오든 설탕에서 오든 결국 포도당·과당으로 분해된다\"**</p>\n<p style='margin-left: 16px;'>• **꿀·메이플시럽·아가베시럽도 식품에 첨가되면 모두 '첨가당'**</p>\n<p style='margin-left: 16px;'>• **코코넛슈거의 GI(혈당지수)·칼로리는 흰 설탕과 비슷한 수준**</p>\n<p style='margin-left: 16px;'>• **50g 기준 열량은 설탕 약 197kcal·꿀 약 162kcal·메이플시럽 약 130kcal로 보도됐지만, 다소 낮아도 첨가당인 것은 같습니다**</p>\n<h3>《얼마나 먹어도 될까》</h3>\n<p style='margin-left: 16px;'>• **WHO는 유리당을 하루 총열량의 10% 미만(약 50g), 5%(약 25g)면 더 이롭다고 권고**</p>\n<p style='margin-left: 16px;'>• **미국심장협회는 하루 남성 36g·여성 25g 이하 권고**</p>\n<p style='margin-left: 16px;'>• **권장량과 신체 반응에는 개인차가 있습니다**</p>\n<h3>《오늘 할 일》</h3>\n<p style='margin-left: 16px;'>• **성분표에서 당류(g) 합계를 확인하고, 꿀·시럽도 그 총량 안에 포함해 계산하세요**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **미량 영양소 차이는 있으나 '건강식품'이라 볼 근거는 아닙니다**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**</p>\n<p>저장해두고 장 볼 때 꺼내 보세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #첨가당 #천연감미료 #아가베시럽 #메이플시럽 #코코넛슈거 #GI혈당지수 #당류섭취권고 #성분표 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중  이미지 업로드 위치)</div>\n<h3>Point 02. 2025 청소년건강행태조사에서 처음 조사된 청소년 제로음료 섭취율과 성장기 장기 섭취에 대한 연구 공백 세부 권고 사항 및 영양 팩트</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 03. 2025 청소년건강행태조사에서 처음 조사된 청소년 제로음료 섭취율과 성장기 장기 섭취에 대한 연구 공백 다이어터가 주의해야 할 점</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<h2>💡 상세 분석 및 과학적 팩트체크</h2>\n<p>남학생 5명 중 1명이 제로음료 주 3회 이상 · 청소년 첫 공식 조사 결과</p>\n<p>2025 청소년건강행태조사에서 제로음료 섭취율이 처음으로 조사됐습니다.</p>\n<h3>《핵심 수치》</h3>\n<p style='margin-left: 16px;'>• **주 3회 이상 섭취: 남학생 20.1%, 여학생 12.7%**</p>\n<p style='margin-left: 16px;'>• **남학생은 중학생 16.7%, 고등학생 23.6%로 학년이 오를수록 증가**</p>\n<p style='margin-left: 16px;'>• **같은 조사에서 단맛음료 섭취율(남 62.8%, 여 53.5%)은 전년 대비 큰 폭 감소**</p>\n<p style='margin-left: 16px;'>• **질병관리청이 전국 800개 표본학교 중·고생 약 6만명 조사(참여율 93.9%)**</p>\n<h3>《전문가·기관은 어떻게 보나》</h3>\n<p style='margin-left: 16px;'>• **질병관리청 국가건강정보포털은 청소년의 제로음료 섭취가 건강에 이익이 된다는 근거는 아직 불충분하다고 안내합니다**</p>\n<p style='margin-left: 16px;'>• **성장기의 대체 감미료 장기 섭취 영향(단맛 선호, 체중, 장내 미생물 등)은 연구가 더 필요한 영역입니다**</p>\n<p style='margin-left: 16px;'>• **위험이 확정됐다는 뜻이 아니라, 아직 모르는 영역이 남아 있다는 뜻입니다**</p>\n<h3>《오늘 할 수 있는 것》</h3>\n<p style='margin-left: 16px;'>• **갈증 해소 1순위는 물, 제로음료는 매일 습관보다 가끔 즐기기**</p>\n<p style='margin-left: 16px;'>• **이번 주 마신 제로음료 개수를 세어보고, 하루 한 캔을 물이나 무가당 탄산수로 바꿔보세요**</p>\n<p style='margin-left: 16px;'>• **성분표에서 아스파탐·수크랄로스 등 감미료 표기를 확인하는 습관도 도움이 됩니다**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **감미료의 체감 영향에는 개인차가 있습니다**</p>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**</p>\n<p>지금 저장해두고 제로 자주 마시는 사람에게 공유해주세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #제로음료 #청소년건강행태조사 #질병관리청 #대체감미료 #성장기 #단맛음료 #국가건강정보포털 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁 #유지어터 #영양성분표 #성분분석</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-WHO-감미료-체중감량", "data": {"folder": "20260705-WHO-감미료-체중감량", "blog_md": "# [WHO] WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** WHO가 2023년 5월 발표한 비당류 감미료 공식 지침\n\n---\n\n## 🔍 1. 사전 팩트체크 검증 개요\n\n| 검증 항목 | 공인 기관 및 발표 자료 | 핵심 팩트 요약 |\n|---|---|---|\n| **주제 팩트** | WHO / 식약처 공식 가이드라인 | WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 관련 권고 및 연구 발표 원문 검증 |\n| **다이어트 영향** | 체계적 문헌고찰 (Systematic Review) | 인공감미료 장기 섭취 시 체지방 감량 효과 미확인 |\n| **건강 리스크** | 관찰 연구 및 대사질환 지표 | 당뇨 환자 외 일반인의 무분별한 과다 섭취 주의 필요 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `WHO`\n- **연관 키워드:** `비당류 감미료`, `NSS`, `제로슈거`, `조건부 권고`, `체중 감량`, `2형 당뇨병`, `심혈관질환`, `아스파탐`\n- **독자 검색 의도:** WHO가 2023년 5월 발표한 비당류 감미료 공식 지침에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.\n\n---\n\n## 🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"\n\n다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.\n\n하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.\n\n과연 **WHO가 2023년 5월 발표한 비당류 감미료 공식 지침**의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.\n\n---\n\n## 📊 핵심 팩트 카드뉴스\n\n### Point 01. WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 공식 발표 및 핵심 요약\n\n![팩트체크 이미지 1](이미지-01-썸네일.png)\n\n### Point 02. WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 세부 권고 사항 및 영양 팩트\n\n![팩트체크 이미지 2](이미지-02-본문.png)\n\n### Point 03. WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\nWHO \"감미료로는 살 못 뺀다\" · 2023 비당류 감미료 공식 지침 정리\n\n다이어트하려고 제로를 고르셨다면, WHO의 2023년 공식 지침을 먼저 확인하세요.\n\n### 《핵심 내용》\n\n- **WHO는 2023년 5월 15일, 체중 조절이나 비전염성 질환 위험 감소 목적으로 비당류 감미료(NSS)를 사용하지 말 것을 권고**\n\n- **체계적 문헌 검토에서 성인·아동의 장기적인 체지방 감소 효과가 확인되지 않음**\n\n- **장기 섭취가 2형 당뇨병·심혈관질환 위험 증가와 연관된다는 관찰연구 보고**\n\n- **아세설팜K, 아스파탐, 사카린, 수크랄로스, 스테비아 등이 해당**\n\n### 《꼭 알아둘 것》\n\n- **이번 권고는 '조건부 권고'로, 여러 요인이 영향을 미쳤을 수 있어 확정적 결론이 아닙니다**\n\n- **위험 관련 근거는 대부분 관찰연구로, 인과관계가 단정된 것은 아닙니다**\n\n- **기존 당뇨병 환자는 권고 대상에서 제외됩니다**\n\n- **치약 등 개인위생용품, 당알코올은 이번 지침 대상이 아닙니다**\n\n### 《오늘 할 수 있는 행동》\n\n- **성분표에서 아스파탐·수크랄로스·아세설팜칼륨 표기를 확인해보세요**\n\n- **설탕이냐 감미료냐보다, 단맛이 나는 음료·간식의 총량 자체를 한 개 줄여보세요**\n\n### 《참고》\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다. 감미료 반응에는 개인차가 있습니다.**\n\n저장해두고 제로 음료 자주 마시는 친구에게 공유해주세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #WHO #비당류감미료 #NSS #조건부권고 #체중감량 #2형당뇨병 #심혈관질환 #아스파탐 #수크랄로스 #단맛줄이기 #다이어트음료 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단", "app_md": "# [앱게시판] WHO가 2023년 5월 발표한 비당류 감미료(NSS) 공식 지침 — 체중 조절 목적 사용을 하지 말 것(조건부 권고), 장기 섭취와 2형 당뇨·심혈관질환 위험의 '연관' 보고, 당뇨 환자 예외 칼로리 팩트체크\n\n## 1. 게시판 제목\n\nWHO가 2023년 5월 발표한 비당류 감미료(NSS) 공식 지침 — 체중 조절 목적 사용을 하지 말 것(조건부 권고), 장기 섭취와 2형 당뇨·심혈관질환 위험의 '연관' 보고, 들고 있습니다.</p>\n<p>과연 <b>WHO가 2023년 5월 발표한 비당류 감미료 공식 지침</b>의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.</p>\n<p>---</p>\n<h2>📊 핵심 팩트 카드뉴스</h2>\n<h3>Point 01. WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 공식 발표 및 핵심 요약</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 02. WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 세부 권고 사항 및 영양 팩트</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<h3>Point 03. WHO가 2023년 5월 발표한 비당류 감미료 공식 지침 다이어터가 주의해야 할 점</h3>\n<div class='img-placeholder'>🖼️ <b>팩트체크 이미지 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<h2>💡 상세 분석 및 과학적 팩트체크</h2>\n<p>WHO \"감미료로는 살 못 뺀다\" · 2023 비당류 감미료 공식 지침 정리</p>\n<p>다이어트하려고 제로를 고르셨다면, WHO의 2023년 공식 지침을 먼저 확인하세요.</p>\n<h3>《핵심 내용》</h3>\n<p style='margin-left: 16px;'>• **WHO는 2023년 5월 15일, 체중 조절이나 비전염성 질환 위험 감소 목적으로 비당류 감미료(NSS)를 사용하지 말 것을 권고**</p>\n<p style='margin-left: 16px;'>• **체계적 문헌 검토에서 성인·아동의 장기적인 체지방 감소 효과가 확인되지 않음**</p>\n<p style='margin-left: 16px;'>• **장기 섭취가 2형 당뇨병·심혈관질환 위험 증가와 연관된다는 관찰연구 보고**</p>\n<p style='margin-left: 16px;'>• **아세설팜K, 아스파탐, 사카린, 수크랄로스, 스테비아 등이 해당**</p>\n<h3>《꼭 알아둘 것》</h3>\n<p style='margin-left: 16px;'>• **이번 권고는 '조건부 권고'로, 여러 요인이 영향을 미쳤을 수 있어 확정적 결론이 아닙니다**</p>\n<p style='margin-left: 16px;'>• **위험 관련 근거는 대부분 관찰연구로, 인과관계가 단정된 것은 아닙니다**</p>\n<p style='margin-left: 16px;'>• **기존 당뇨병 환자는 권고 대상에서 제외됩니다**</p>\n<p style='margin-left: 16px;'>• **치약 등 개인위생용품, 당알코올은 이번 지침 대상이 아닙니다**</p>\n<h3>《오늘 할 수 있는 행동》</h3>\n<p style='margin-left: 16px;'>• **성분표에서 아스파탐·수크랄로스·아세설팜칼륨 표기를 확인해보세요**</p>\n<p style='margin-left: 16px;'>• **설탕이냐 감미료냐보다, 단맛이 나는 음료·간식의 총량 자체를 한 개 줄여보세요**</p>\n<h3>《참고》</h3>\n<p style='margin-left: 16px;'>• **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다. 감미료 반응에는 개인차가 있습니다.**</p>\n<p>저장해두고 제로 음료 자주 마시는 친구에게 공유해주세요.</p>\n<p>---</p>\n<h2>🛡️ 다이어터를 위한 올바른 섭취 가이드</h2>\n<blockquote>**💡 핵심 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.</blockquote>\n<blockquote>2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.</blockquote>\n<blockquote>3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.</blockquote>\n<p>---</p>\n<h2>💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?</h2>\n<p>평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!</p>\n<p>도움이 되셨다면 <b>[공감 ❤️]</b>과 <b>[이웃추가]</b> 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.</p>\n<p>*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #WHO #비당류감미료 #NSS #조건부권고 #체중감량 #2형당뇨병 #심혈관질환 #아스파탐 #수크랄로스 #단맛줄이기 #다이어트음료 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단</p>"}}, {"category": "단일_카드뉴스(트랙B)", "folder_name": "20260705-제로슈거-표시기준", "data": {"folder": "20260705-제로슈거-표시기준", "blog_md": "# [제로슈거] 2026년 1월 시행 '식품등의 표시기준' 개정 — 다이어터가 매일 마시던 제로의 진실\n\n> **작성일:** 2026-07-05  \n> **콘텐츠 허브:** `@dessrtj` 디저트 팩트체크 허브  \n> **주제 분석:** 2026년 1월 시행 '식품등의 표시기준' 개정\n\n---\n\n## 🔍 1. 사전 팩트체크 검증 개요\n\n| 검증 항목 | 공인 기관 및 발표 자료 | 핵심 팩트 요약 |\n|---|---|---|\n| **주제 팩트** | WHO / 식약처 공식 가이드라인 | 2026년 1월 시행 '식품등의 표시기준' 개정 관련 권고 및 연구 발표 원문 검증 |\n| **다이어트 영향** | 체계적 문헌고찰 (Systematic Review) | 인공감미료 장기 섭취 시 체지방 감량 효과 미확인 |\n| **건강 리스크** | 관찰 연구 및 대사질환 지표 | 당뇨 환자 외 일반인의 무분별한 과다 섭취 주의 필요 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `제로슈거`\n- **연관 키워드:** `무설탕`, `무가당`, `식품등의 표시기준`, `식약처`, `감미료`, `에리스리톨`, `자일리톨`, `스테비올배당체`\n- **독자 검색 의도:** 2026년 1월 시행 '식품등의 표시기준' 개정에 대해 떠도는 소문과 마케팅 속에서 실제 과학적 연구 결과와 안전 섭취 기준을 확인하고자 함.\n\n---\n\n## 🥤 \"설탕만 피하면 살 빠질 줄 알았는데...\"\n\n다이어트를 결심한 순간부터 우리의 장바구니는 온통 '제로'와 '무설탕' 글자로 가득 찹니다. 탄산음료도 제로, 커피 시럽도 대체당, 간식도 무설탕 프로틴바를 고르며 '이제 단맛을 즐겨도 살찔 걱정은 없겠지'라며 안도하곤 하죠.\n\n하지만 최근 세계보건기구(WHO)와 국내외 보건 당국에서 발표되는 연구 결과들은 우리의 이러한 상식을 정면으로 뒤흔들고 있습니다.\n\n과연 **2026년 1월 시행 '식품등의 표시기준' 개정**의 실체는 무엇일까요? 오늘은 감정적인 공포 마케팅을 걷어내고, 공인된 학술 데이터와 가이드라인을 바탕으로 객관적인 진실을 정리해 드립니다.\n\n---\n\n## 📊 핵심 팩트 카드뉴스\n\n### Point 01. 2026년 1월 시행 '식품등의 표시기준' 개정 공식 발표 및 핵심 요약\n\n![팩트체크 이미지 1](이미지-01-썸네일.png)\n\n### Point 02. 2026년 1월 시행 '식품등의 표시기준' 개정 세부 권고 사항 및 영양 팩트\n\n![팩트체크 이미지 2](이미지-02-본문.png)\n\n### Point 03. 2026년 1월 시행 '식품등의 표시기준' 개정 다이어터가 주의해야 할 점\n\n![팩트체크 이미지 3](이미지-03-여분.png)\n\n## 💡 상세 분석 및 과학적 팩트체크\n\n제로슈거인데 0칼로리가 아니라고? 올해 1월부터 라벨이 달라졌습니다\n\n제로슈거·무설탕·무가당을 강조하는 식품은 이제 감미료 함유 여부와 열량을 함께 표시해야 합니다.\n\n### 《무엇이 바뀌었나》\n\n- **식약처가 2024년 7월 24일 '식품등의 표시기준' 개정·고시, 2026년 1월 1일 시행**\n\n- **제로슈거·무당·무가당 강조 제품은 '감미료 함유' 표시와 열량을 강조표시 옆에 병기**\n\n- **명칭·용도를 함께 적어야 하는 감미료가 5종에서 22종으로 확대**\n\n- **에리스리톨, 자일리톨, 말티톨시럽, 스테비올배당체 등 17종 추가**\n\n### 《왜 중요한가》\n\n- **'제로슈거=열량 없음'이 아닙니다. 일부 감미료는 열량이 있어 열량 병기가 의무화된 것**\n\n- **이제 매대에서 강조표시 옆 열량 숫자만 봐도 확인 가능**\n\n### 《행동 가이드》\n\n- **제로·무설탕 제품을 살 때 강조표시 옆 '감미료 함유'와 열량 숫자를 확인하세요**\n\n### 《참고》\n\n- **본 콘텐츠는 정보 제공 목적이며 의학적 진단·치료를 대체하지 않습니다**\n\n- **감미료에 대한 단맛 인지·소화 반응은 개인차가 있습니다**\n\n저장해두고 장보기 전에 다시 확인하세요.\n\n\n\n---\n\n## 🛡️ 다이어터를 위한 올바른 섭취 가이드\n\n> **💡 핵심 실천 원칙:**\n>\n> 1. **대체 감미료에 과도하게 의존하지 않기:** 감미료는 설탕을 끊기 위한 과도기적 도구일 뿐, 영구적인 체중 감량 만능 열쇠가 아닙니다.\n> 2. **단맛 자체에 대한 역치 낮추기:** 뇌가 느끼는 단맛에 대한 갈망 자체를 서서히 줄여나가는 식습관이 궁극적인 해답입니다.\n> 3. **성분표 꼼꼼히 확인하기:** '제로' 표시 뒤에 숨은 당알코올(말티톨, 에리스리톨 등) 함량과 1일 섭취 상한선을 점검하세요.\n\n---\n\n## 💬 여러분의 제로 음료·간식 섭취 습관은 어떠신가요?\n\n평소 하루에 제로 탄산이나 무설탕 디저트를 얼마나 자주 드시나요? 궁금한 점이나 의견을 댓글로 편하게 남겨주세요!\n\n\n도움이 되셨다면 **[공감 ❤️]**과 **[이웃추가]** 부탁드립니다. `@dessrtj`는 객관적인 과학 팩트만을 전달합니다.\n\n\n*본 포스팅은 세계보건기구(WHO) 및 식약처 공식 발표 자료를 바탕으로 작성된 정보성 콘텐츠입니다.*\n\n---\n\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #무가당 #식품등의표시기준 #식약처 #감미료 #에리스리톨 #자일리톨 #스테비올배당체 #열량표시 #라벨확인 #표시기준개정 #인공감미료 #무설탕간식 #식단관리 #다이어터일상 #건강정보 #식약처기준 #WHO권고 #체중조절 #건강식단 #다이어트꿀팁", "app_md": "# [앱게시판] 2026년 1월 시행 '식품등의 표시기준' 개정 — 제로슈거·무설탕·무가당 강조 식품의 감미료 함유·열량 병기 의무화, 용도 표시 감미료 5종22종 확대 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n2026년 1월 시행 '식품등의 표시기준' 개정 — 제로슈거·무설탕·무가당 강조 식품의 감미료 함유·열량 병기 의무화, 용도 표시 감미료 5종22종 확대 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n2026년 1월 시행 '식품등의 표시기준' 개정 — 제로슈     let allCampaigns = EMBEDDED_DATA.map(d => ({ category: d.category, folder_name: d.folder_name }));
    let currentCampaign = null;
    let currentContent = null;
    let currentTab = 'blog';

    function init() {
      renderList(allCampaigns);
      if (allCampaigns.length > 0) {
        selectCampaign(allCampaigns[0].folder_name);
      }
    }

    function renderList(list) {
      const ul = document.getElementById('campaign-list');
      ul.innerHTML = '';
      list.forEach(c => {
        const li = document.createElement('li');
        li.className = 'campaign-item' + (currentCampaign === c.folder_name ? ' active' : '');
        li.onclick = () => selectCampaign(c.folder_name);
        li.innerHTML = `
          <div class="campaign-cat">${c.category}</div>
          <div class="campaign-name">${c.folder_name}</div>
          <div class="campaign-badges">
            <span class="badge badge-blog">블로그 2,500자</span>
            <span class="badge badge-app">앱게시판</span>
          </div>
        `;
        ul.appendChild(li);
      });
    }

    function filterCampaigns() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = allCampaigns.filter(c => c.folder_name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
      renderList(filtered);
    }

    function selectCampaign(folder) {
      currentCampaign = folder;
      document.querySelectorAll('.campaign-item').forEach(el => {
        el.classList.toggle('active', el.querySelector('.campaign-name').innerText === folder);
      });
      document.getElementById('current-title').innerText = folder;
      
      const found = EMBEDDED_DATA.find(d => d.folder_name === folder);
      if (found) {
        currentContent = found.data;
        renderViewer();
      }
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((el, idx) => {
        el.classList.toggle('active', (tab === 'blog' && idx === 0) || (tab === 'app' && idx === 1) || (tab === 'raw' && idx === 2));
      });
      renderViewer();
    }

    function renderViewer() {
      if (!currentContent) return;
      const v = document.getElementById('viewer');
      if (currentTab === 'blog') {
        v.className = 'viewer blog-view';
        v.innerHTML = currentContent.blog_html || '<p>내용이 없습니다.</p>';
      } else if (currentTab === 'app') {
        v.className = 'viewer app-view';
        v.innerText = currentContent.app_md || '내용이 없습니다.';
      } else {
        v.className = 'viewer raw-view';
        v.innerText = currentContent.blog_md || '내용이 없습니다.';
      }
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(err => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    function copyCurrentBlog() {
      if (currentContent && currentContent.blog_md) {
        copyToClipboard(currentContent.blog_md, '📋 네이버 블로그 원고가 복사되었습니다!');
      }
    }

    function copyCurrentTags() {
      if (currentContent && currentContent.blog_md) {
        const m = currentContent.blog_md.match(/🏷️\s*네이버\s*블로그\s*태그[^
]*
+([^
]+)/);
        if (m) {
          copyToClipboard(m[1].trim(), '🏷️ 네이버 블로그 태그 30개가 복사되었습니다!');
        } else {
          alert('태그를 찾을 수 없습니다.');
        }
      }
    }

    function copyCurrentApp() {
      if (currentContent && currentContent.app_md) {
        copyToClipboard(currentContent.app_md, '📱 앱 게시판 텍스트가 복사되었습니다!');
      }
    }

    window.onload = init;
  </script>
</body>
</html>
