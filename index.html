를 지금 웹 서비스에서 무료로 체험해보세요!\n> 👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**\n\n---\n\n## 📝 한 줄 요약 & 실천 팁\n\n1. **에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙**은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.\n2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.\n\n\n*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*\n\n\n---\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #에리스리톨 #0kcal감미료 #심혈관위험 #NatureMedicine #무설탕디저트 #다이어트감미료 #당알코올 #StanleyHazen #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법", "app_md": "# [앱게시판] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙에 대한 영양 팩트체크 정보입니다.\n\n이 콘텐츠는 \"0kcal 표시만 보고 안심하던\" 다이어터의 인지 부조화를 정조준한다.\n\n타겟은 일상적으로 무설탕 아이스크림·프로틴바·다이어트 콜라를 마시며 \"건강하게 절제하고 있다\"는 자기 효능감을 충전 중이다. 그런데 \"심장에 무리\"라는 한 문장이 표지에서 등장하는 순간, 평소 신뢰하던 라벨 자체가 흔들린다. 검정·빨강의 위험 시그널 컬러 조합은 스크롤을 멈추게 만들고, \"Nature Medicine 2023\"이라는 권위 출처가 클릭의 마지막 저항을 무너뜨린다.\n\n저장 동기는 \"다음 마트 갈 때 성분표를 다시 봐야 한다\"는 즉시적 행동 필요에서 발생한다. 4번 슬라이드의 카테고리 체크리스트와 성분표 키워드는 사실상 쇼핑 직전에 꺼낼 레퍼런스 카드가 된다 — 즉 콘텐츠가 앱처럼 기능한다.\n\n공유 동기는 \"내 가족도 매일 무설탕 디저트 먹는데\"라는 가족 단위 걱정에서 출발한다. 특히 심혈관 가족력이 있는 사람은 보조 타겟으로 자연스럽게 흡수되며, 가족 단톡방·헬스 동호회 톡방 공유가 일어난다.\n\n가장 큰 진입 장벽은 \"그래서 끊으라는 거야 말라는 거야?\"의 혼란이다. 이를 5번 슬라이드의 균형 잡힌 양팔 저울로 해소한다 — \"끊을 필요 없지만 누적이 위험\"이라는 메시지는 공포 마케팅이 아니라 실용 가이드라는 인식을 만든다. 결과적으로 콘텐츠 신뢰도가 올라가 팔로우로 이어진다.\n\n행동 지연을 막는 카피는 6번 슬라이드의 \"분산 · 자연 단맛 · 가족력 체크\" 3원칙이다. 추상적 경고가 아니라 오늘 저녁 장보기에서 바로 적용 가능한 행동이라 \"나중에 봐야지\"가 아닌 \"지금 저장\"으로 행동이 압축된다.\n\n의외의 후크는 \"당뇨 환자에게는 여전히 유익\"이라는 균형 메시지다. 당뇨 가족을 둔 보조 타겟이 이 한 줄로 콘텐츠에 신뢰를 주고, 시리즈 전체(2~5편)로 유입되는 진입 게이트가 된다.\n\n---\n\n\"0kcal니까 매일 먹어도 괜찮겠지?\" — 그렇게 믿고 계셨다면 꼭 끝까지 봐주세요.\n\n2023년 Nature Medicine 발표\n미국 클리블랜드 클리닉이 4,000명을 3년간 추적한 결과,\n혈중 에리스리톨 농도 상위 25% 그룹은\n심근경색·뇌졸중 위험이 약 2배 높았어요.\n\n어디에 들어있나\n· 무설탕 아이스크림 / 프로틴 아이스크림\n· 0칼로리 시리얼 바, 저당 잼·시럽\n· 다이어트 음료, 무설탕 초콜릿\n\n다이어터 3원칙\n1□ 한 감미료에 몰빵하지 말고 분산 (알룰로스·스테비아·나한과)\n2□ 가공 디저트보다 자연 단맛\n3□ 심혈관 가족력 있다면 더 신중\n\nFDA·EFSA 승인 자체는 유지 중. 단, \"누적 섭취\"가 진짜 위험이라는 게 연구진 결론이에요.\n\n저장해두고 마트에서 성분표 확인할 때 꺼내보세요\n\n\n[핵심 실천 수칙]\n□ - 타이틀: 다이어터를 위한 똑똑한 3원칙\n□ 1. 한 가지에 의존하지 않기 — 알룰로스·스테비아·나한과 분산\n□ 2. 가공 디저트보다 자연 단맛 — 베리류·사과·바나나로 만족감\n□ 3. 가족력 체크 — 심혈관·뇌졸중 가족력 시 비중 줄이기, 임산부·신부전은 의사 상담\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#에리스리톨 #0kcal감미료 #심혈관위험 #Nature Medicine\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[에리스리톨] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크</h1>\n<blockquote>**작성일:** 2026-05-17</blockquote>\n<blockquote>**콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 & 검증 결과</h2>\n<table>\n<tr><th>검증 항목</th><th>검증 기준 및 공인 출처</th><th>판정 및 권고 사항</th></tr>\n<tr><td>**주제 팩트**</td><td>식약처 영양성분 DB / WHO 지침</td><td>에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 관련 영양 수치 정밀 확인</td></tr>\n<tr><td>**칼로리·당류**</td><td>한국영양학회 1일 권장 섭취 기준</td><td>가공식품 및 외식 곁들이 숨은 칼로리 검증</td></tr>\n<tr><td>**감미료/첨가물**</td><td>식품공전 및 공인 학술 자료</td><td>말티톨, 알룰로스, 당알코올 내약량 기준 대조</td></tr>\n</table>\n<h2>🎯 2. 검색 최적화(SEO) 키워드 전략</h2>\n<p style='margin-left: 16px;'>• **메인 키워드:** `에리스리톨`</p>\n<p style='margin-left: 16px;'>• **연관 키워드 (8종):** `0kcal감미료`, `심혈관위험`, `Nature Medicine`, `무설탕디저트`, `다이어트감미료`, `당알코올`, `Stanley Hazen`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.</p>\n<p>---</p>\n<h2>💡 3. 블로그 제목 3종 후보</h2>\n<p style='margin-left: 16px;'>• **A타입 (검색 최적화 전진배치형 · 채택):** [에리스리톨] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크</p>\n<p style='margin-left: 16px;'>• **B타입 (공감 질문·반전형):** \"에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실</p>\n<p style='margin-left: 16px;'>• **C타입 (수치·현실 가이드형):** 에리스리톨 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드</p>\n<p>---</p>\n<h2>🧐 다이어트 중 마주치는 착각과 현실</h2>\n<p>이 콘텐츠는 \"0kcal 표시만 보고 안심하던\" 다이어터의 인지 부조화를 정조준한다.</p>\n<p>타겟은 일상적으로 무설탕 아이스크림·프로틴바·다이어트 콜라를 마시며 \"건강하게 절제하고 있다\"는 자기 효능감을 충전 중이다. 그런데 \"심장에 무리\"라는 한 문장이 표지에서 등장하는 순간, 평소 신뢰하던 라벨 자체가 흔들린다. 검정·빨강의 위험 시그널 컬러 조합은 스크롤을 멈추게 만들고, \"Nature Medicine 2023\"이라는 권위 출처가 클릭의 마지막 저항을 무너뜨린다.</p>\n<p>저장 동기는 \"다음 마트 갈 때 성분표를 다시 봐야 한다\"는 즉시적 행동 필요에서 발생한다. 4번 슬라이드의 카테고리 체크리스트와 성분표 키워드는 사실상 쇼핑 직전에 꺼낼 레퍼런스 카드가 된다 — 즉 콘텐츠가 <b>앱처럼 기능</b>한다.</p>\n<p>공유 동기는 \"내 가족도 매일 무설탕 디저트 먹는데\"라는 가족 단위 걱정에서 출발한다. 특히 심혈관 가족력이 있는 사람은 보조 타겟으로 자연스럽게 흡수되며, 가족 단톡방·헬스 동호회 톡방 공유가 일어난다.</p>\n<p>가장 큰 진입 장벽은 \"그래서 끊으라는 거야 말라는 거야?\"의 혼란이다. 이를 5번 슬라이드의 균형 잡힌 양팔 저울로 해소한다 — \"끊을 필요 없지만 누적이 위험\"이라는 메시지는 공포 마케팅이 아니라 실용 가이드라는 인식을 만든다. 결과적으로 콘텐츠 신뢰도가 올라가 팔로우로 이어진다.</p>\n<p>행동 지연을 막는 카피는 6번 슬라이드의 <b>\"분산 · 자연 단맛 · 가족력 체크\"</b> 3원칙이다. 추상적 경고가 아니라 오늘 저녁 장보기에서 바로 적용 가능한 행동이라 \"나중에 봐야지\"가 아닌 \"지금 저장\"으로 행동이 압축된다.</p>\n<p>의외의 후크는 \"당뇨 환자에게는 여전히 유익\"이라는 균형 메시지다. 당뇨 가족을 둔 보조 타겟이 이 한 줄로 콘텐츠에 신뢰를 주고, 시리즈 전체(2~5편)로 유입되는 진입 게이트가 된다.</p>\n<p>---</p>\n<p>---</p>\n<h2>📊 카드뉴스로 보는 핵심 분석</h2>\n<h3>[카드뉴스 Point 01] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 1 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 02] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 2 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 03] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 3 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 04] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 4 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 05] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 5 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 06] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 6</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 6 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 07] 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 7</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙 - 슬라이드 7 상세 팩트 카드*</p>\n<p>---</p>\n<h2>💡 상세 영양 데이터 & 메커니즘 분석</h2>\n<p>\"0kcal니까 매일 먹어도 괜찮겠지?\" — 그렇게 믿고 계셨다면 꼭 끝까지 봐주세요.</p>\n<p>📌 2023년 Nature Medicine 발표</p>\n<p>미국 클리블랜드 클리닉이 4,000명을 3년간 추적한 결과,</p>\n<p>혈중 에리스리톨 농도 상위 25% 그룹은</p>\n<p>심근경색·뇌졸중 위험이 약 2배 높았어요.</p>\n<p>📍 어디에 들어있나</p>\n<p>· 무설탕 아이스크림 / 프로틴 아이스크림</p>\n<p>· 0칼로리 시리얼 바, 저당 잼·시럽</p>\n<p>· 다이어트 음료, 무설탕 초콜릿</p>\n<p>📋 다이어터 3원칙</p>\n<p>1️⃣ 한 감미료에 몰빵하지 말고 분산 (알룰로스·스테비아·나한과)</p>\n<p>2️⃣ 가공 디저트보다 자연 단맛</p>\n<p>3️⃣ 심혈관 가족력 있다면 더 신중</p>\n<p>⏰ FDA·EFSA 승인 자체는 유지 중. 단, \"누적 섭취\"가 진짜 위험이라는 게 연구진 결론이에요.</p>\n<p>🔖 저장해두고 마트에서 성분표 확인할 때 꺼내보세요</p>\n<p>---</p>\n<h2>🛡️ 다이어터 현실 생존 가이드</h2>\n<blockquote>**💡 오늘부터 즉시 적용하는 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>- - **타이틀**: 다이어터를 위한 똑똑한 3원칙</blockquote>\n<blockquote>- 1. **한 가지에 의존하지 않기** — 알룰로스·스테비아·나한과 분산</blockquote>\n<blockquote>- 2. **가공 디저트보다 자연 단맛** — 베리류·사과·바나나로 만족감</blockquote>\n<blockquote>- 3. **가족력 체크** — 심혈관·뇌졸중 가족력 시 비중 줄이기, 임산부·신부전은 의사 상담</blockquote>\n<p>---</p>\n<h2>📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)</h2>\n<blockquote>[!TIP]</blockquote>\n<blockquote>**\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**</blockquote>\n<blockquote>말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!</blockquote>\n<blockquote>👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**</blockquote>\n<p>---</p>\n<h2>📝 한 줄 요약 & 실천 팁</h2>\n<p>1. <b>에리스리톨의 심혈관 위험 + 똑똑한 섭취 3원칙</b>은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.</p>\n<p>2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.</p>\n<p>*본 콘텐츠는 식품의약품안전처 영양성  호소하는 친구·헬스 동료에게 \"혹시 너 무설탕 디저트 자주 먹어? 이것 때문일 수도 있어\"라며 보내게 된다. 둘째, IBS(과민성대장증후군) 보유자 커뮤니티에서 \"이거 진짜 우리 얘기\"로 자생적 확산이 일어난다.\n\n가장 큰 진입 장벽은 \"그래도 다이어트 중인데 단 거 안 먹을 순 없잖아\"의 체념이다. 이를 4번 슬라이드의 4원칙 — 특히 **\"끊는 게 아니라 식후·소량·혼합으로 바꾸기\"** — 로 해소한다. 행동 부담을 최소화한 가이드라서 \"오늘 저녁부터 적용 가능\"으로 인식된다.\n\n행동 지연을 막는 카피는 표지의 **체감형 질문**이다. 추상적 위험 경고가 아니라 \"어제 내가 느낀 그 느낌\"을 정확히 짚기 때문에 \"나중에 봐야지\"가 아닌 \"지금 당장 확인\"으로 행동이 압축된다.\n\n의외의 후크는 1편(에리스리톨)과의 연결성이다. \"1편에서 에리스리톨이 위험하다더니, 대안인 알룰로스도 결국 부작용이 있다고?\"의 흐름은 시리즈 신뢰도를 강화하고, **\"그럼 도대체 뭘 먹으라는 거야\"의 호기심**을 유발해 3편(요거트 아이스크림)·4편·5편까지 시리즈 정주행을 유도한다. 1편을 본 사람은 2편을 안 볼 수 없는 구조다.\n\n---\n\n---\n\n## 📊 카드뉴스로 보는 핵심 분석\n\n### [카드뉴스 Point 01] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증\n\n![카드뉴스 슬라이드 1](slide_1.svg)\n\n*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 1 상세 팩트 카드*\n\n### [카드뉴스 Point 02] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증\n\n![카드뉴스 슬라이드 2](slide_2.svg)\n\n*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 2 상세 팩트 카드*\n\n### [카드뉴스 Point 03] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증\n\n![카드뉴스 슬라이드 3](slide_3.svg)\n\n*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 3 상세 팩트 카드*\n\n### [카드뉴스 Point 04] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증\n\n![카드뉴스 슬라이드 4](slide_4.svg)\n\n*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 4 상세 팩트 카드*\n\n### [카드뉴스 Point 05] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증\n\n![카드뉴스 슬라이드 5](slide_5.svg)\n\n*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 5 상세 팩트 카드*\n\n---\n\n## 💡 상세 영양 데이터 & 메커니즘 분석\n\n\"0kcal라는데 왜 먹고 나면 속이 더부룩할까?\" — 혹시 비슷한 경험 있으셨나요?\n\n📌 알룰로스는 '희소당'\n무화과·건포도·메이플시럽에 미량 있는 자연 유래 당으로,\n단맛은 설탕의 70%인데 칼로리는 1/10이라\n2024년 국내 시장이 4년 만에 12배(100억→1,200억) 커졌어요.\n\n📍 그런데 왜 불편할까?\n· 위→소장에서는 거의 흡수가 안 돼서 0kcal인 게 맞음\n· 문제는 그대로 대장 도착 → 장내 세균이 발효\n· 가스·수분 발생 → 복부 팽만 · 복통 · 설사\n\n📋 다이어터 4원칙\n1️⃣ 1일 5g부터 소량 테스트 → 본인 한계선 파악\n2️⃣ 공복 ❌ 식후 ⭕ (단백질·지방과 함께)\n3️⃣ 알룰로스 100% 제품 ❌ → 스테비아·에리스리톨 혼합 ⭕\n4️⃣ 운동·외출 전 자제, 잠들기 전·집에서\n\n⏰ FDA 권장량: 60kg 성인 = 24g/회. 아이스크림 1통 + 초콜릿 + 음료면 한 끼에 이미 초과예요.\n\n🔖 저장 → 마트 갈 때 성분표 확인용\n\n---\n\n## 🛡️ 다이어터 현실 생존 가이드\n\n> **💡 오늘부터 즉시 적용하는 실천 원칙:**\n>\n> - - **FDA 권장**: 0.4g/kg → 60kg=24g/회 · 70kg=28g/회\n> - - ⚠ 아이스크림(20g) + 초콜릿(12g) + 음료(10g) = 한 끼 40g 초과 쉬움\n> - - **4원칙**:\n> - 1. 1일 5g부터 소량 테스트 → 한계선 파악\n> - 2. 공복 ❌ 식후 ⭕ (단백질·지방 완충)\n> - 3. 알룰로스 단일 ❌ → 스테비아·에리스리톨 혼합 ⭕\n> - 4. 운동·외출 전 자제, 잠들기 전·집에서 섭취\n\n\n---\n\n## 📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)\n\n> [!TIP]\n> **\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**  \n> 말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!\n> 👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**\n\n---\n\n## 📝 한 줄 요약 & 실천 팁\n\n1. **\"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙**은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.\n2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.\n\n\n*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*\n\n\n---\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #알룰로스 #희소당 #장트러블 #복부팽만 #무설탕디저트 #IBS #FDA권장량 #희소당부작용 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법", "app_md": "# [앱게시판] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n\"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n\"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙에 대한 영양 팩트체크 정보입니다.\n\n이 콘텐츠는 \"분명 0kcal인데 왜 먹으면 속이 안 좋지?\"라는, 다이어터들이 일상에서 느꼈지만 원인을 정확히 몰라 그냥 넘어갔던 이름 없는 불편함에 이름을 붙여준다.\n\n타겟은 무설탕 아이스크림 한 통을 비우고 30분 뒤 더부룩함을 느낀 경험이 누구나 한 번씩 있다. 그동안은 \"그냥 과식했나?\", \"장이 약한가?\"로 자기 탓을 했지만, 표지에서 \"0kcal인데 왜 속이 더부룩할까?\"라는 한 줄을 보는 순간 자신의 막연한 의심이 검증받는다. 이 검증의 쾌감이 스크롤을 멈추게 만든다.\n\n저장 동기는 4번 슬라이드의 FDA 권장량 수치(24g) + 시중 제품 실제 함량 비교에서 발생한다. \"아이스크림 1통이 권장량 절반\"이라는 구체 수치는 다음에 마트에서 제품 뒷면을 볼 때 반드시 다시 꺼내볼 정보가 된다 — 즉 콘텐츠가 계산기 역할을 한다.\n\n공유 동기는 두 갈래다. 첫째, 평소 장 트러블을 자주 호소하는 친구·헬스 동료에게 \"혹시 너 무설탕 디저트 자주 먹어? 이것 때문일 수도 있어\"라며 보내게 된다. 둘째, IBS(과민성대장증후군) 보유자 커뮤니티에서 \"이거 진짜 우리 얘기\"로 자생적 확산이 일어난다.\n\n가장 큰 진입 장벽은 \"그래도 다이어트 중인데 단 거 안 먹을 순 없잖아\"의 체념이다. 이를 4번 슬라이드의 4원칙 — 특히 \"끊는 게 아니라 식후·소량·혼합으로 바꾸기\" — 로 해소한다. 행동 부담을 최소화한 가이드라서 \"오늘 저녁부터 적용 가능\"으로 인식된다.\n\n행동 지연을 막는 카피는 표지의 체감형 질문이다. 추상적 위험 경고가 아니라 \"어제 내가 느낀 그 느낌\"을 정확히 짚기 때문에 \"나중에 봐야지\"가 아닌 \"지금 당장 확인\"으로 행동이 압축된다.\n\n의외의 후크는 1편(에리스리톨)과의 연결성이다. \"1편에서 에리스리톨이 위험하다더니, 대안인 알룰로스도 결국 부작용이 있다고?\"의 흐름은 시리즈 신뢰도를 강화하고, \"그럼 도대체 뭘 먹으라는 거야\"의 호기심을 유발해 3편(요거트 아이스크림)·4편·5편까지 시리즈 정주행을 유도한다. 1편을 본 사람은 2편을 안 볼 수 없는 구조다.\n\n---\n\n\"0kcal라는데 왜 먹고 나면 속이 더부룩할까?\" — 혹시 비슷한 경험 있으셨나요?\n\n알룰로스는 '희소당'\n무화과·건포도·메이플시럽에 미량 있는 자연 유래 당으로,\n단맛은 설탕의 70%인데 칼로리는 1/10이라\n2024년 국내 시장이 4년 만에 12배(100억1,200억) 커졌어요.\n\n그런데 왜 불편할까?\n· 위소장에서는 거의 흡수가 안 돼서 0kcal인 게 맞음\n· 문제는 그대로 대장 도착  장내 세균이 발효\n· 가스·수분 발생  복부 팽만 · 복통 · 설사\n\n다이어터 4원칙\n1□ 1일 5g부터 소량 테스트  본인 한계선 파악\n2□ 공복  식후  (단백질·지방과 함께)\n3□ 알룰로스 100% 제품   스테비아·에리스리톨 혼합\n4□ 운동·외출 전 자제, 잠들기 전·집에서\n\nFDA 권장량: 60kg 성인 = 24g/회. 아이스크림 1통 + 초콜릿 + 음료면 한 끼에 이미 초과예요.\n\n저장  마트 갈 때 성분표 확인용\n\n\n[핵심 실천 수칙]\n□ - FDA 권장: 0.4g/kg  60kg=24g/회 · 70kg=28g/회\n□ -  아이스크림(20g) + 초콜릿(12g) + 음료(10g) = 한 끼 40g 초과 쉬움\n□ - 4원칙:\n□ 1. 1일 5g부터 소량 테스트  한계선 파악\n□ 2. 공복  식후  (단백질·지방 완충)\n□ 3. 알룰로스 단일   스테비아·에리스리톨 혼합 \n□ 4. 운동·외출 전 자제, 잠들기 전·집에서 섭취\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#알룰로스 #희소당 #장트러블 #복부팽만\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[알룰로스] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크</h1>\n<blockquote>**작성일:** 2026-05-17</blockquote>\n<blockquote>**콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 & 검증 결과</h2>\n<table>\n<tr><th>검증 항목</th><th>검증 기준 및 공인 출처</th><th>판정 및 권고 사항</th></tr>\n<tr><td>**주제 팩트**</td><td>식약처 영양성분 DB / WHO 지침</td><td>\"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 관련 영양 수치 정밀 확인</td></tr>\n<tr><td>**칼로리·당류**</td><td>한국영양학회 1일 권장 섭취 기준</td><td>가공식품 및 외식 곁들이 숨은 칼로리 검증</td></tr>\n<tr><td>**감미료/첨가물**</td><td>식품공전 및 공인 학술 자료</td><td>말티톨, 알룰로스, 당알코올 내약량 기준 대조</td></tr>\n</table>\n<h2>🎯 2. 검색 최적화(SEO) 키워드 전략</h2>\n<p style='margin-left: 16px;'>• **메인 키워드:** `알룰로스`</p>\n<p style='margin-left: 16px;'>• **연관 키워드 (8종):** `희소당`, `장트러블`, `복부팽만`, `무설탕디저트`, `IBS`, `FDA권장량`, `희소당부작용`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.</p>\n<p>---</p>\n<h2>💡 3. 블로그 제목 3종 후보</h2>\n<p style='margin-left: 16px;'>• **A타입 (검색 최적화 전진배치형 · 채택):** [알룰로스] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크</p>\n<p style='margin-left: 16px;'>• **B타입 (공감 질문·반전형):** \"\"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실</p>\n<p style='margin-left: 16px;'>• **C타입 (수치·현실 가이드형):** 알룰로스 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드</p>\n<p>---</p>\n<h2>🧐 다이어트 중 마주치는 착각과 현실</h2>\n<p>이 콘텐츠는 \"분명 0kcal인데 왜 먹으면 속이 안 좋지?\"라는, 다이어터들이 일상에서 느꼈지만 원인을 정확히 몰라 그냥 넘어갔던 <b>이름 없는 불편함</b>에 이름을 붙여준다.</p>\n<p>타겟은 무설탕 아이스크림 한 통을 비우고 30분 뒤 더부룩함을 느낀 경험이 누구나 한 번씩 있다. 그동안은 \"그냥 과식했나?\", \"장이 약한가?\"로 자기 탓을 했지만, 표지에서 \"0kcal인데 왜 속이 더부룩할까?\"라는 한 줄을 보는 순간 <b>자신의 막연한 의심이 검증받는다</b>. 이 검증의 쾌감이 스크롤을 멈추게 만든다.</p>\n<p>저장 동기는 4번 슬라이드의 <b>FDA 권장량 수치(24g) + 시중 제품 실제 함량 비교</b>에서 발생한다. \"아이스크림 1통이 권장량 절반\"이라는 구체 수치는 다음에 마트에서 제품 뒷면을 볼 때 반드시 다시 꺼내볼 정보가 된다 — 즉 콘텐츠가 <b>계산기 역할</b>을 한다.</p>\n<p>공유 동기는 두 갈래다. 첫째, 평소 장 트러블을 자주 호소하는 친구·헬스 동료에게 \"혹시 너 무설탕 디저트 자주 먹어? 이것 때문일 수도 있어\"라며 보내게 된다. 둘째, IBS(과민성대장증후군) 보유자 커뮤니티에서 \"이거 진짜 우리 얘기\"로 자생적 확산이 일어난다.</p>\n<p>가장 큰 진입 장벽은 \"그래도 다이어트 중인데 단 거 안 먹을 순 없잖아\"의 체념이다. 이를 4번 슬라이드의 4원칙 — 특히 <b>\"끊는 게 아니라 식후·소량·혼합으로 바꾸기\"</b> — 로 해소한다. 행동 부담을 최소화한 가이드라서 \"오늘 저녁부터 적용 가능\"으로 인식된다.</p>\n<p>행동 지연을 막는 카피는 표지의 <b>체감형 질문</b>이다. 추상적 위험 경고가 아니라 \"어제 내가 느낀 그 느낌\"을 정확히 짚기 때문에 \"나중에 봐야지\"가 아닌 \"지금 당장 확인\"으로 행동이 압축된다.</p>\n<p>의외의 후크는 1편(에리스리톨)과의 연결성이다. \"1편에서 에리스리톨이 위험하다더니, 대안인 알룰로스도 결국 부작용이 있다고?\"의 흐름은 시리즈 신뢰도를 강화하고, <b>\"그럼 도대체 뭘 먹으라는 거야\"의 호기심</b>을 유발해 3편(요거트 아이스크림)·4편·5편까지 시리즈 정주행을 유도한다. 1편을 본 사람은 2편을 안 볼 수 없는 구조다.</p>\n<p>---</p>\n<p>---</p>\n<h2>📊 카드뉴스로 보는 핵심 분석</h2>\n<h3>[카드뉴스 Point 01] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 1 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 02] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 2 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 03] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 3 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 04] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 4 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 05] \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙 - 슬라이드 5 상세 팩트 카드*</p>\n<p>---</p>\n<h2>💡 상세 영양 데이터 & 메커니즘 분석</h2>\n<p>\"0kcal라는데 왜 먹고 나면 속이 더부룩할까?\" — 혹시 비슷한 경험 있으셨나요?</p>\n<p>📌 알룰로스는 '희소당'</p>\n<p>무화과·건포도·메이플시럽에 미량 있는 자연 유래 당으로,</p>\n<p>단맛은 설탕의 70%인데 칼로리는 1/10이라</p>\n<p>2024년 국내 시장이 4년 만에 12배(100억→1,200억) 커졌어요.</p>\n<p>📍 그런데 왜 불편할까?</p>\n<p>· 위→소장에서는 거의 흡수가 안 돼서 0kcal인 게 맞음</p>\n<p>· 문제는 그대로 대장 도착 → 장내 세균이 발효</p>\n<p>· 가스·수분 발생 → 복부 팽만 · 복통 · 설사</p>\n<p>📋 다이어터 4원칙</p>\n<p>1️⃣ 1일 5g부터 소량 테스트 → 본인 한계선 파악</p>\n<p>2️⃣ 공복 ❌ 식후 ⭕ (단백질·지방과 함께)</p>\n<p>3️⃣ 알룰로스 100% 제품 ❌ → 스테비아·에리스리톨 혼합 ⭕</p>\n<p>4️⃣ 운동·외출 전 자제, 잠들기 전·집에서</p>\n<p>⏰ FDA 권장량: 60kg 성인 = 24g/회. 아이스크림 1통 + 초콜릿 + 음료면 한 끼에 이미 초과예요.</p>\n<p>🔖 저장 → 마트 갈 때 성분표 확인용</p>\n<p>---</p>\n<h2>🛡️ 다이어터 현실 생존 가이드</h2>\n<blockquote>**💡 오늘부터 즉시 적용하는 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>- - **FDA 권장**: 0.4g/kg → 60kg=24g/회 · 70kg=28g/회</blockquote>\n<blockquote>- - ⚠ 아이스크림(20g) + 초콜릿(12g) + 음료(10g) = 한 끼 40g 초과 쉬움</blockquote>\n<blockquote>- - **4원칙**:</blockquote>\n<blockquote>- 1. 1일 5g부터 소량 테스트 → 한계선 파악</blockquote>\n<blockquote>- 2. 공복 ❌ 식후 ⭕ (단백질·지방 완충)</blockquote>\n<blockquote>- 3. 알룰로스 단일 ❌ → 스테비아·에리스리톨 혼합 ⭕</blockquote>\n<blockquote>- 4. 운동·외출 전 자제, 잠들기 전·집에서 섭취</blockquote>\n<p>---</p>\n<h2>📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)</h2>\n<blockquote>[!TIP]</blockquote>\n<blockquote>**\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**</blockquote>\n<blockquote>말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!</blockquote>\n<blockquote>👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**</blockquote>\n<p>---</p>\n<h2>📝 한 줄 요약 & 실천 팁</h2>\n<p>1. <b>\"흡수 안 됨 = 안전\"의 함정 + 알룰로스 안전 섭취 4원칙</b>은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.</p>\n<p>2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.</p>\n<p>*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #알룰로스 #희소당 #장트러블 #복부팽만 #무설탕디저트 #IBS #FDA권장량 #희소당부작용 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법</p>"}}, {"category": "시리즈_SVG(트랙A)", "folder_name": "3_yogurt_icecream", "data": {"folder": "3_yogurt_icecream", "blog_md": "# [요아정] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n\n> **작성일:** 2026-05-17  \n> **콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브  \n> **타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자\n\n---\n\n## 🔍 1. 사전 팩트체크 & 검증 결과\n\n| 검증 항목 | 검증 기준 및 공인 출처 | 판정 및 권고 사항 |\n|---|---|---|\n| **주제 팩트** | 식약처 영양성분 DB / WHO 지침 | \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 관련 영양 수치 정밀 확인 |\n| **칼로리·당류** | 한국영양학회 1일 권장 섭취 기준 | 가공식품 및 외식 곁들이 숨은 칼로리 검증 |\n| **감미료/첨가물** | 식품공전 및 공인 학술 자료 | 말티톨, 알룰로스, 당알코올 내약량 기준 대조 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `요아정`\n- **연관 키워드 (8종):** `요거트아이스크림`, `다이어트디저트함정`, `토핑당류`, `비요뜨얼리기`, `그릭요거트`, `홈메이드아이스크림`, `가성비디저트`\n- **독자 검색 의도:** \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.\n\n---\n\n## 💡 3. 블로그 제목 3종 후보\n\n- **A타입 (검색 최적화 전진배치형 · 채택):** [요아정] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n- **B타입 (공감 질문·반전형):** \"\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실\n- **C타입 (수치·현실 가이드형):** 요아정 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드\n\n---\n\n## 🧐 다이어트 중 마주치는 착각과 현실\n\n이 콘텐츠는 \"건강한 척하면서 사실은 가장 달고 비싼 디저트를 먹고 있던\" 다이어터의 인지 부조화를 즉시 깨뜨린다.\n\n타겟은 \"요거트 = 다이어트\"라는 통념과 \"요아정·요거트아이스크림의정석\" 매장 1년 새 3배 증가라는 사회 분위기 속에서 \"그래도 아이스크림보다는 낫겠지\"라는 자기 합리화로 주 1~3회 12,000원짜리 한 컵을 먹어왔다. 표지의 \"콜라 2캔\"이라는 환산은 추상적 칼로리·당류 수치보다 **즉각 와닿는 시각적 충격**을 만든다 — \"내가 그런 짓을 했다고?\"의 자기 검증이 일어나는 순간 스크롤이 멈춘다.\n\n저장 동기는 두 갈래다. 첫째, 4번 슬라이드의 **매장 5원칙** — \"사이즈 S + 토핑 2개 + 시럽 사이드\"는 다음 디저트 카페 방문에서 즉시 꺼낼 행동 가이드다. 둘째, 같은 슬라이드의 **홈메이드 레시피** — 비요뜨 냉동 3시간이라는 진입 장벽 0짜리 해법은 \"오늘 편의점 가는 길에 사야지\"의 즉시 행동을 유발한다. 콘텐츠가 **쇼핑 리스트**가 된다.\n\n공유 동기는 강력하다. 디저트 카페는 보통 친구·연인과 함께 가는 공간이라 \"야 이거 봐봐, 우리 요아정 갈 때마다 콜라 2캔 마신 거였대\"라는 메시지가 단톡방·DM으로 자연 확산된다. 특히 **3번 슬라이드의 위험 토핑 막대그래프**는 캡처 한 장으로 단톡방에 던지기 좋은 포맷이라 콘텐츠 외 노출이 일어난다 — 정보 우월감과 의사결정 트리거가 동시 작용.\n\n가장 큰 진입 장벽은 \"그래도 가끔은 먹어야지, 사는 낙인데\"의 정서다. 이를 5원칙의 **\"주 1회 = 치팅 데이 보상 디저트\"**와 홈메이드 대안으로 해소한다. \"끊으라는 게 아니라 다르게 먹으라는 거\"라는 메시지는 다이어트 콘텐츠 특유의 죄책감을 회피하면서 행동만 바꾼다.\n\n행동 지연을 막는 카피는 4번 슬라이드의 **비교 표(500kcal·60g·12,000원 → 180kcal·12g·2,500원)** 한 줄이다. 칼로리·당류·비용 3개 축이 동시에 1/5로 줄어드는 시각적 충격은 \"그럼 오늘부터 그렇게 해볼까\"의 결심을 만든다.\n\n의외의 후크는 1·2편과의 시리즈 연결성이다. **1편(에리스리톨)·2편(알룰로스)이 \"감미료 자체의 위험\"이었다면 3편은 \"디저트 카테고리 통념의 배신\"**으로 결이 다르다. 이 변주가 시리즈의 단조로움을 깨고 4편(제로콜라)·5편(단백질바)까지의 호기심을 강화한다.\n\n---\n\n---\n\n## 📊 카드뉴스로 보는 핵심 분석\n\n### [카드뉴스 Point 01] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증\n\n![카드뉴스 슬라이드 1](slide_1.svg)\n\n*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 1 상세 팩트 카드*\n\n### [카드뉴스 Point 02] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증\n\n![카드뉴스 슬라이드 2](slide_2.svg)\n\n*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 2 상세 팩트 카드*\n\n### [카드뉴스 Point 03] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증\n\n![카드뉴스 슬라이드 3](slide_3.svg)\n\n*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 3 상세 팩트 카드*\n\n### [카드뉴스 Point 04] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증\n\n![카드뉴스 슬라이드 4](slide_4.svg)\n\n*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 4 상세 팩트 카드*\n\n### [카드뉴스 Point 05] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증\n\n![카드뉴스 슬라이드 5](slide_5.svg)\n\n*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 5 상세 팩트 카드*\n\n---\n\n## 💡 상세 영양 데이터 & 메커니즘 분석\n\n\"다이어트 한다고 요아정 시켰는데, 알고 보니 콜라 2캔 마신 셈?\" — 진짜입니다.\n\n📌 영양성분 한판 비교\n🥤 코카콜라 250ml: 108kcal / 당류 27g\n🍦 요아정 R + 토핑 3종(시리얼·초코시럽·마시멜로): 450~600kcal / 당류 50~70g\n→ 당류 콜라 약 2캔분, 칼로리는 4~5배\n\n📍 그런데 요거트 자체는 양호해요\n플레인 요거트 베이스 R 1컵 = 당류 8~12g\n🚨 진짜 범인은 토핑\n· 초코시럽 30g → 약 20g (콜라 1캔분)\n· 캐러멜소스 30g → 약 18g\n· 마시멜로 한 줌 → 약 15g\n\n📋 다이어터 매장 5원칙\n1️⃣ 사이즈는 무조건 S (R 베이스만 200kcal)\n2️⃣ 토핑 2개 + 1개는 생과일 필수\n3️⃣ 시럽은 사이드로 따로 (섭취량 50% ↓)\n4️⃣ 운동 직후 1시간 OK / 자기 전 3시간 절대 X\n5️⃣ 빈도 = 주 1회 (치팅데이 보상)\n\n🏠 가성비 홈메이드\n· 비요뜨 1개 + 냉동실 3시간 = 부드러운 아이스크림 (1,500원, 요아정 1/8)\n· 무가당 그릭 + 냉동베리 + 견과류 + 알룰로스 1ts (3분 완성)\n→ 요아정 500kcal·60g·12,000원 → 홈메이드 180kcal·12g·2,500원\n\n🔖 저장 → 다음 디저트 카페 갈 때 꺼내보세요\n📷 홈메이드 만들면 #dessrtj 태그해주세요\n\n---\n\n## 🛡️ 다이어터 현실 생존 가이드\n\n> **💡 다이어트 생존 핵심 수칙:**\n>\n> - **1. 주 메뉴보다 곁들이를 통제하라**: 탄수화물/알코올 곁들이(냉면, 소주, 볶음밥 등)가 칼로리의 주범입니다.\n> - **2. 식이섬유(채소) 먼저 섭취**: 첫 입을 채소로 시작하여 혈당 스파이크와 과식을 방어하세요.\n> - **3. 성분표 읽는 습관 들이기**: 마케팅 문구(무설탕, 제로)에 현혹되지 말고 원재료명을 확인하세요.\n\n---\n\n## 📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)\n\n> [!TIP]\n> **\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**  \n> 말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!\n> 👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**\n\n---\n\n## 📝 한 줄 요약 & 실천 팁\n\n1. **\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안**은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.\n2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.\n\n\n*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*\n\n\n---\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #요아정 #요거트아이스크림 #다이어트디저트함정 #토핑당류 #비요뜨얼리기 #그릭요거트 #홈메이드아이스크림 #가성비디저트 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법", "app_md": "# [앱게시판] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안에 대한 영양 팩트체크 정보입니다.\n\n이 콘텐츠는 \"건강한 척하면서 사실은 가장 달고 비싼 디저트를 먹고 있던\" 다이어터의 인지 부조화를 즉시 깨뜨린다.\n\n타겟은 \"요거트 = 다이어트\"라는 통념과 \"요아정·요거트아이스크림의정석\" 매장 1년 새 3배 증가라는 사회 분위기 속에서 \"그래도 아이스크림보다는 낫겠지\"라는 자기 합리화로 주 1~3회 12,000원짜리 한 컵을 먹어왔다. 표지의 \"콜라 2캔\"이라는 환산은 추상적 칼로리·당류 수치보다 즉각 와닿는 시각적 충격을 만든다 — \"내가 그런 짓을 했다고?\"의 자기 검증이 일어나는 순간 스크롤이 멈춘다.\n\n저장 동기는 두 갈래다. 첫째, 4번 슬라이드의 매장 5원칙 — \"사이즈 S + 토핑 2개 + 시럽 사이드\"는 다음 디저트 카페 방문에서 즉시 꺼낼 행동 가이드다. 둘째, 같은 슬라이드의 홈메이드 레시피 — 비요뜨 냉동 3시간이라는 진입 장벽 0짜리 해법은 \"오늘 편의점 가는 길에 사야지\"의 즉시 행동을 유발한다. 콘텐츠가 쇼핑 리스트가 된다.\n\n공유 동기는 강력하다. 디저트 카페는 보통 친구·연인과 함께 가는 공간이라 \"야 이거 봐봐, 우리 요아정 갈 때마다 콜라 2캔 마신 거였대\"라는 메시지가 단톡방·DM으로 자연 확산된다. 특히 3번 슬라이드의 위험 토핑 막대그래프는 캡처 한 장으로 단톡방에 던지기 좋은 포맷이라 콘텐츠 외 노출이 일어난다 — 정보 우월감과 의사결정 트리거가 동시 작용.\n\n가장 큰 진입 장벽은 \"그래도 가끔은 먹어야지, 사는 낙인데\"의 정서다. 이를 5원칙의 \"주 1회 = 치팅 데이 보상 디저트\"와 홈메이드 대안으로 해소한다. \"끊으라는 게 아니라 다르게 먹으라는 거\"라는 메시지는 다이어트 콘텐츠 특유의 죄책감을 회피하면서 행동만 바꾼다.\n\n행동 지연을 막는 카피는 4번 슬라이드의 비교 표(500kcal·60g·12,000원  180kcal·12g·2,500원) 한 줄이다. 칼로리·당류·비용 3개 축이 동시에 1/5로 줄어드는 시각적 충격은 \"그럼 오늘부터 그렇게 해볼까\"의 결심을 만든다.\n\n의외의 후크는 1·2편과의 시리즈 연결성이다. 1편(에리스리톨)·2편(알룰로스)이 \"감미료 자체의 위험\"이었다면 3편은 \"디저트 카테고리 통념의 배신\"으로 결이 다르다. 이 변주가 시리즈의 단조로움을 깨고 4편(제로콜라)·5편(단백질바)까지의 호기심을 강화한다.\n\n---\n\n\"다이어트 한다고 요아정 시켰는데, 알고 보니 콜라 2캔 마신 셈?\" — 진짜입니다.\n\n영양성분 한판 비교\n코카콜라 250ml: 108kcal / 당류 27g\n요아정 R + 토핑 3종(시리얼·초코시럽·마시멜로): 450~600kcal / 당류 50~70g\n당류 콜라 약 2캔분, 칼로리는 4~5배\n\n그런데 요거트 자체는 양호해요\n플레인 요거트 베이스 R 1컵 = 당류 8~12g\n진짜 범인은 토핑\n· 초코시럽 30g  약 20g (콜라 1캔분)\n· 캐러멜소스 30g  약 18g\n· 마시멜로 한 줌  약 15g\n\n다이어터 매장 5원칙\n1□ 사이즈는 무조건 S (R 베이스만 200kcal)\n2□ 토핑 2개 + 1개는 생과일 필수\n3□ 시럽은 사이드로 따로 (섭취량 50% )\n4□ 운동 직후 1시간 OK / 자기 전 3시간 절대 X\n5□ 빈도 = 주 1회 (치팅데이 보상)\n\n가성비 홈메이드\n· 비요뜨 1개 + 냉동실 3시간 = 부드러운 아이스크림 (1,500원, 요아정 1/8)\n· 무가당 그릭 + 냉동베리 + 견과류 + 알룰로스 1ts (3분 완성)\n요아정 500kcal·60g·12,000원  홈메이드 180kcal·12g·2,500원\n\n저장  다음 디저트 카페 갈 때 꺼내보세요\n홈메이드 만들면 #dessrtj 태그해주세요\n\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#요아정 #요거트아이스크림 #다이어트디저트함정 #토핑당류\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[요아정] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크</h1>\n<blockquote>**작성일:** 2026-05-17</blockquote>\n<blockquote>**콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 & 검증 결과</h2>\n<table>\n<tr><th>검증 항목</th><th>검증 기준 및 공인 출처</th><th>판정 및 권고 사항</th></tr>\n<tr><td>**주제 팩트**</td><td>식약처 영양성분 DB / WHO 지침</td><td>\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 관련 영양 수치 정밀 확인</td></tr>\n<tr><td>**칼로리·당류**</td><td>한국영양학회 1일 권장 섭취 기준</td><td>가공식품 및 외식 곁들이 숨은 칼로리 검증</td></tr>\n<tr><td>**감미료/첨가물**</td><td>식품공전 및 공인 학술 자료</td><td>말티톨, 알룰로스, 당알코올 내약량 기준 대조</td></tr>\n</table>\n<h2>🎯 2. 검색 최적화(SEO) 키워드 전략</h2>\n<p style='margin-left: 16px;'>• **메인 키워드:** `요아정`</p>\n<p style='margin-left: 16px;'>• **연관 키워드 (8종):** `요거트아이스크림`, `다이어트디저트함정`, `토핑당류`, `비요뜨얼리기`, `그릭요거트`, `홈메이드아이스크림`, `가성비디저트`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.</p>\n<p>---</p>\n<h2>💡 3. 블로그 제목 3종 후보</h2>\n<p style='margin-left: 16px;'>• **A타입 (검색 최적화 전진배치형 · 채택):** [요아정] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크</p>\n<p style='margin-left: 16px;'>• **B타입 (공감 질문·반전형):** \"\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실</p>\n<p style='margin-left: 16px;'>• **C타입 (수치·현실 가이드형):** 요아정 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드</p>\n<p>---</p>\n<h2>🧐 다이어트 중 마주치는 착각과 현실</h2>\n<p>이 콘텐츠는 \"건강한 척하면서 사실은 가장 달고 비싼 디저트를 먹고 있던\" 다이어터의 인지 부조화를 즉시 깨뜨린다.</p>\n<p>타겟은 \"요거트 = 다이어트\"라는 통념과 \"요아정·요거트아이스크림의정석\" 매장 1년 새 3배 증가라는 사회 분위기 속에서 \"그래도 아이스크림보다는 낫겠지\"라는 자기 합리화로 주 1~3회 12,000원짜리 한 컵을 먹어왔다. 표지의 \"콜라 2캔\"이라는 환산은 추상적 칼로리·당류 수치보다 <b>즉각 와닿는 시각적 충격</b>을 만든다 — \"내가 그런 짓을 했다고?\"의 자기 검증이 일어나는 순간 스크롤이 멈춘다.</p>\n<p>저장 동기는 두 갈래다. 첫째, 4번 슬라이드의 <b>매장 5원칙</b> — \"사이즈 S + 토핑 2개 + 시럽 사이드\"는 다음 디저트 카페 방문에서 즉시 꺼낼 행동 가이드다. 둘째, 같은 슬라이드의 <b>홈메이드 레시피</b> — 비요뜨 냉동 3시간이라는 진입 장벽 0짜리 해법은 \"오늘 편의점 가는 길에 사야지\"의 즉시 행동을 유발한다. 콘텐츠가 <b>쇼핑 리스트</b>가 된다.</p>\n<p>공유 동기는 강력하다. 디저트 카페는 보통 친구·연인과 함께 가는 공간이라 \"야 이거 봐봐, 우리 요아정 갈 때마다 콜라 2캔 마신 거였대\"라는 메시지가 단톡방·DM으로 자연 확산된다. 특히 <b>3번 슬라이드의 위험 토핑 막대그래프</b>는 캡처 한 장으로 단톡방에 던지기 좋은 포맷이라 콘텐츠 외 노출이 일어난다 — 정보 우월감과 의사결정 트리거가 동시 작용.</p>\n<p>가장 큰 진입 장벽은 \"그래도 가끔은 먹어야지, 사는 낙인데\"의 정서다. 이를 5원칙의 <b>\"주 1회 = 치팅 데이 보상 디저트\"</b>와 홈메이드 대안으로 해소한다. \"끊으라는 게 아니라 다르게 먹으라는 거\"라는 메시지는 다이어트 콘텐츠 특유의 죄책감을 회피하면서 행동만 바꾼다.</p>\n<p>행동 지연을 막는 카피는 4번 슬라이드의 <b>비교 표(500kcal·60g·12,000원 → 180kcal·12g·2,500원)</b> 한 줄이다. 칼로리·당류·비용 3개 축이 동시에 1/5로 줄어드는 시각적 충격은 \"그럼 오늘부터 그렇게 해볼까\"의 결심을 만든다.</p>\n<p>의외의 후크는 1·2편과의 시리즈 연결성이다. <b>1편(에리스리톨)·2편(알룰로스)이 \"감미료 자체의 위험\"이었다면 3편은 \"디저트 카테고리 통념의 배신\"</b>으로 결이 다르다. 이 변주가 시리즈의 단조로움을 깨고 4편(제로콜라)·5편(단백질바)까지의 호기심을 강화한다.</p>\n<p>---</p>\n<p>---</p>\n<h2>📊 카드뉴스로 보는 핵심 분석</h2>\n<h3>[카드뉴스 Point 01] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 1 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 02] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 2 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 03] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 3 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 04] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 4 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 05] \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ \"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안 - 슬라이드 5 상세 팩트 카드*</p>\n<p>---</p>\n<h2>💡 상세 영양 데이터 & 메커니즘 분석</h2>\n<p>\"다이어트 한다고 요아정 시켰는데, 알고 보니 콜라 2캔 마신 셈?\" — 진짜입니다.</p>\n<p>📌 영양성분 한판 비교</p>\n<p>🥤 코카콜라 250ml: 108kcal / 당류 27g</p>\n<p>🍦 요아정 R + 토핑 3종(시리얼·초코시럽·마시멜로): 450~600kcal / 당류 50~70g</p>\n<p>→ 당류 콜라 약 2캔분, 칼로리는 4~5배</p>\n<p>📍 그런데 요거트 자체는 양호해요</p>\n<p>플레인 요거트 베이스 R 1컵 = 당류 8~12g</p>\n<p>🚨 진짜 범인은 토핑</p>\n<p>· 초코시럽 30g → 약 20g (콜라 1캔분)</p>\n<p>· 캐러멜소스 30g → 약 18g</p>\n<p>· 마시멜로 한 줌 → 약 15g</p>\n<p>📋 다이어터 매장 5원칙</p>\n<p>1️⃣ 사이즈는 무조건 S (R 베이스만 200kcal)</p>\n<p>2️⃣ 토핑 2개 + 1개는 생과일 필수</p>\n<p>3️⃣ 시럽은 사이드로 따로 (섭취량 50% ↓)</p>\n<p>4️⃣ 운동 직후 1시간 OK / 자기 전 3시간 절대 X</p>\n<p>5️⃣ 빈도 = 주 1회 (치팅데이 보상)</p>\n<p>🏠 가성비 홈메이드</p>\n<p>· 비요뜨 1개 + 냉동실 3시간 = 부드러운 아이스크림 (1,500원, 요아정 1/8)</p>\n<p>· 무가당 그릭 + 냉동베리 + 견과류 + 알룰로스 1ts (3분 완성)</p>\n<p>→ 요아정 500kcal·60g·12,000원 → 홈메이드 180kcal·12g·2,500원</p>\n<p>🔖 저장 → 다음 디저트 카페 갈 때 꺼내보세요</p>\n<p>📷 홈메이드 만들면 #dessrtj 태그해주세요</p>\n<p>---</p>\n<h2>🛡️ 다이어터 현실 생존 가이드</h2>\n<blockquote>**💡 다이어트 생존 핵심 수칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>- **1. 주 메뉴보다 곁들이를 통제하라**: 탄수화물/알코올 곁들이(냉면, 소주, 볶음밥 등)가 칼로리의 주범입니다.</blockquote>\n<blockquote>- **2. 식이섬유(채소) 먼저 섭취**: 첫 입을 채소로 시작하여 혈당 스파이크와 과식을 방어하세요.</blockquote>\n<blockquote>- **3. 성분표 읽는 습관 들이기**: 마케팅 문구(무설탕, 제로)에 현혹되지 말고 원재료명을 확인하세요.</blockquote>\n<p>---</p>\n<h2>📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)</h2>\n<blockquote>[!TIP]</blockquote>\n<blockquote>**\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**</blockquote>\n<blockquote>말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!</blockquote>\n<blockquote>👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**</blockquote>\n<p>---</p>\n<h2>📝 한 줄 요약 & 실천 팁</h2>\n<p>1. <b>\"요아정 = 콜라 2캔\" 영양성분 충격 + 똑똑한 주문법·홈메이드 대안</b>은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.</p>\n<p>2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.</p>\n<p>*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #요아정 #요거트아이스크림 #다이어트디저트함정 #토핑당류 #비요뜨얼리기 #그릭요거트 #홈메이드아이스크림 #가성비디저트 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법</p>"}}, {"category": "시리즈_SVG(트랙A)", "folder_name": "4_zero_cola", "data": {"folder": "4_zero_cola", "blog_md": "# [제로콜라] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n\n> **작성일:** 2026-05-17  \n> **콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브  \n> **타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자\n\n---\n\n## 🔍 1. 사전 팩트체크 & 검증 결과\n\n| 검증 항목 | 검증 기준 및 공인 출처 | 판정 및 권고 사항 |\n|---|---|---|\n| **주제 팩트** | 식약처 영양성분 DB / WHO 지침 | WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 관련 영양 수치 정밀 확인 |\n| **칼로리·당류** | 한국영양학회 1일 권장 섭취 기준 | 가공식품 및 외식 곁들이 숨은 칼로리 검증 |\n| **감미료/첨가물** | 식품공전 및 공인 학술 자료 | 말티톨, 알룰로스, 당알코올 내약량 기준 대조 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `제로콜라`\n- **연관 키워드 (8종):** `아스파탐`, `WHO발암논란`, `IARC`, `Group2B`, `제로음료안전섭취량`, `단맛역치`, `PKU`\n- **독자 검색 의도:** WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.\n\n---\n\n## 💡 3. 블로그 제목 3종 후보\n\n- **A타입 (검색 최적화 전진배치형 · 채택):** [제로콜라] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n- **B타입 (공감 질문·반전형):** \"WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실\n- **C타입 (수치·현실 가이드형):** 제로콜라 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드\n\n---\n\n## 🧐 다이어트 중 마주치는 착각과 현실\n\n이 콘텐츠는 \"WHO 발암 분류\"라는 단어 하나만 보고 막연히 불안해하던 다이어터에게 **정확한 좌표**를 제공한다.\n\n타겟은 2023년 7월 이후 \"제로콜라 = 발암\"이라는 헤드라인을 SNS·뉴스에서 반복 노출당했다. 끊자니 다이어트 중 탄산을 못 마시면 식단이 무너지고, 계속 마시자니 매일 불안한 상태가 1년 넘게 지속 중이다. 표지의 **\"암 걸린다고?\"**라는 직접 인용 질문은 그동안 입 밖으로 못 꺼냈던 본인의 막연한 불안을 정확히 짚어주고, **WHO 라벨**은 \"팩트체크가 진짜 들어 있겠다\"는 신뢰의 첫 단추를 채운다.\n\n저장 동기는 2번 슬라이드의 **IARC 분류표**에서 발생한다. \"아스파탐 = 김치·고사리와 같은 Group 2B\"라는 한 줄의 의외성은 캡처해서 단톡방에 던지기 좋은 정보다 — **지식 우월감 + 즉시 공유 트리거**. 동시에 3번 슬라이드의 **체중별 안전선 표**는 \"내 몸무게 기준 정확히 몇 캔까지\"의 개인 맞춤 정보라 저장 후 반복 확인이 일어난다.\n\n공유 동기는 두 갈래다. 첫째, 정보 우월감(\"야 너 모르지? 아스파탐 김치랑 같은 등급이래\") — 카페·헬스장 대화 소재. 둘째, **보호자 모드** — 임산부 친구, 자녀에게 제로음료를 자주 주는 부모, PKU 환자 가족 등 회피군에게 \"이거 꼭 봐야 해\" 메시지로 전달된다. 4번 슬라이드 회피군 박스가 옐로 하이라이트로 시각적으로 튀는 이유다.\n\n가장 큰 진입 장벽은 **이중 메시지의 혼란**이다. \"안전하다고 하면서 우려된다고도 하니까 결국 뭘 어떻게 하라는 거야?\" 이를 3번 슬라이드의 **명확한 분리** — \"발암은 걱정 X / 단맛 의존·장내 미생물·식욕 자극이 진짜 문제 O\" — 로 해소한다. 위험의 정체를 재정의함으로써 \"발암 걱정 끊고 → 단맛 역치에 집중\"으로 행동 방향이 명확해진다.\n\n행동 지연을 막는 카피는 4번 슬라이드의 **\"감미료 로테이션\"** 원칙이다. 끊으라는 게 아니라 \"오늘은 제로콜라(아스파탐), 내일은 제로사이다(수크랄로스)\"식으로 바꾸기만 하면 되는 미니멀 행동 변화라 즉시 실행 가능.\n\n의외의 후크는 **시리즈 흐름 안에서의 위치**다. 1편(에리스리톨 = 심혈관 위험), 2편(알룰로스 = 장 부작용), 3편(요거트 아이스크림 = 토핑 함정)에서 누적된 \"그럼 뭘 마시지/먹지?\"의 질문에 4편이 **\"제로음료는 사실 발암 걱정은 안 해도 된다\"**는 의외의 안도 메시지를 던지면서 시리즈 신뢰도가 정점에 오른다. 단순 위험 나열이 아니라 **위험과 안전을 객관적으로 구분**하는 매체라는 인식이 5편(단백질바)까지의 정주행을 보장한다.\n\n---\n\n---\n\n## 📊 카드뉴스로 보는 핵심 분석\n\n### [카드뉴스 Point 01] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증\n\n![카드뉴스 슬라이드 1](slide_1.svg)\n\n*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 1 상세 팩트 카드*\n\n### [카드뉴스 Point 02] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증\n\n![카드뉴스 슬라이드 2](slide_2.svg)\n\n*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 2 상세 팩트 카드*\n\n### [카드뉴스 Point 03] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증\n\n![카드뉴스 슬라이드 3](slide_3.svg)\n\n*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 3 상세 팩트 카드*\n\n### [카드뉴스 Point 04] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증\n\n![카드뉴스 슬라이드 4](slide_4.svg)\n\n*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 4 상세 팩트 카드*\n\n### [카드뉴스 Point 05] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증\n\n![카드뉴스 슬라이드 5](slide_5.svg)\n\n*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 5 상세 팩트 카드*\n\n---\n\n## 💡 상세 영양 데이터 & 메커니즘 분석\n\n\"제로콜라 매일 마시면 암 걸린다고?\" — 2023년 7월부터 1년 넘게 불안하셨다면 꼭 끝까지 봐주세요.\n\n📌 사실은 이렇습니다\n2023.6 WHO IARC 회의 → 7.14 아스파탐을 \"발암 가능 물질(Group 2B)\"로 분류 → 7.15 한국 식약처는 \"현행 ADI 유지\" 발표\n\n📍 Group 2B의 진짜 의미\n· Group 1: 흡연 · 알코올 · 가공육 (확실한 발암물질)\n· Group 2A: 적색육 · 야간근무 (가능성 높음)\n· **Group 2B: 아스파탐 · 김치 · 고사리** (가능성 있음, 인체 증거 부족)\n· Group 3: 카페인 · 차 (분류 불가)\n\n즉 아스파탐은 **김치·고사리와 같은 등급**입니다. \"발암물질\" ≠ \"먹으면 무조건 암\".\n\n📋 하루 몇 캔까지 안전?\nWHO 1일 허용량(ADI) = 아스파탐 40mg/kg · 제로콜라 1캔 ≈ 180mg\n이론상 50kg 11캔 / 60kg 13캔 / 70kg 15캔까지 가능하지만\n**현실 권장은 하루 1~2캔** (제로사이다·맥스 누적 주의)\n\n⚠️ 진짜 우려는 발암이 아니라 따로 있어요\n🧠 단맛 역치 상승 → 더 단 음식 갈망 → 다이어트 효과 ↓\n🦠 장내 미생물 변화 + 인슐린 저항성 연구 진행 중\n😋 단맛만 받고 칼로리 X → 뇌가 \"더 먹어\" 신호\n💧 갈증 해소 X (카페인 이뇨로 오히려 탈수)\n\n🚫 회피군: 임산부 · 수유부 · 페닐케톤뇨증(PKU) 환자 · 12세 미만 어린이\n\n🔖 저장 → 친구·가족에게 공유해주세요\n\n---\n\n## 🛡️ 다이어터 현실 생존 가이드\n\n> **💡 다이어트 생존 핵심 수칙:**\n>\n> - **1. 주 메뉴보다 곁들이를 통제하라**: 탄수화물/알코올 곁들이(냉면, 소주, 볶음밥 등)가 칼로리의 주범입니다.\n> - **2. 식이섬유(채소) 먼저 섭취**: 첫 입을 채소로 시작하여 혈당 스파이크와 과식을 방어하세요.\n> - **3. 성분표 읽는 습관 들이기**: 마케팅 문구(무설탕, 제로)에 현혹되지 말고 원재료명을 확인하세요.\n\n---\n\n## 📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)\n\n> [!TIP]\n> **\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**  \n> 말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!\n> 👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**\n\n---\n\n## 📝 한 줄 요약 & 실천 팁\n\n1. **WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트**은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.\n2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.\n\n\n*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*\n\n\n---\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #제로콜라 #아스파탐 #WHO발암논란 #IARC #Group2B #제로음료안전섭취량 #단맛역치 #PKU #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법", "app_md": "# [앱게시판] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 칼로리 팩트체크\n\n## 1. 게시판 제목\n\nWHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\nWHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트에 대한 영양 팩트체크 정보입니다.\n\n이 콘텐츠는 \"WHO 발암 분류\"라는 단어 하나만 보고 막연히 불안해하던 다이어터에게 정확한 좌표를 제공한다.\n\n타겟은 2023년 7월 이후 \"제로콜라 = 발암\"이라는 헤드라인을 SNS·뉴스에서 반복 노출당했다. 끊자니 다이어트 중 탄산을 못 마시면 식단이 무너지고, 계속 마시자니 매일 불안한 상태가 1년 넘게 지속 중이다. 표지의 \"암 걸린다고?\"라는 직접 인용 질문은 그동안 입 밖으로 못 꺼냈던 본인의 막연한 불안을 정확히 짚어주고, WHO 라벨은 \"팩트체크가 진짜 들어 있겠다\"는 신뢰의 첫 단추를 채운다.\n\n저장 동기는 2번 슬라이드의 IARC 분류표에서 발생한다. \"아스파탐 = 김치·고사리와 같은 Group 2B\"라는 한 줄의 의외성은 캡처해서 단톡방에 던지기 좋은 정보다 — 지식 우월감 + 즉시 공유 트리거. 동시에 3번 슬라이드의 체중별 안전선 표는 \"내 몸무게 기준 정확히 몇 캔까지\"의 개인 맞춤 정보라 저장 후 반복 확인이 일어난다.\n\n공유 동기는 두 갈래다. 첫째, 정보 우월감(\"야 너 모르지? 아스파탐 김치랑 같은 등급이래\") — 카페·헬스장 대화 소재. 둘째, 보호자 모드 — 임산부 친구, 자녀에게 제로음료를 자주 주는 부모, PKU 환자 가족 등 회피군에게 \"이거 꼭 봐야 해\" 메시지로 전달된다. 4번 슬라이드 회피군 박스가 옐로 하이라이트로 시각적으로 튀는 이유다.\n\n가장 큰 진입 장벽은 이중 메시지의 혼란이다. \"안전하다고 하면서 우려된다고도 하니까 결국 뭘 어떻게 하라는 거야?\" 이를 3번 슬라이드의 명확한 분리 — \"발암은 걱정 X / 단맛 의존·장내 미생물·식욕 자극이 진짜 문제 O\" — 로 해소한다. 위험의 정체를 재정의함으로써 \"발암 걱정 끊고  단맛 역치에 집중\"으로 행동 방향이 명확해진다.\n\n행동 지연을 막는 카피는 4번 슬라이드의 \"감미료 로테이션\" 원칙이다. 끊으라는 게 아니라 \"오늘은 제로콜라(아스파탐), 내일은 제로사이다(수크랄로스)\"식으로 바꾸기만 하면 되는 미니멀 행동 변화라 즉시 실행 가능.\n\n의외의 후크는 시리즈 흐름 안에서의 위치다. 1편(에리스리톨 = 심혈관 위험), 2편(알룰로스 = 장 부작용), 3편(요거트 아이스크림 = 토핑 함정)에서 누적된 \"그럼 뭘 마시지/먹지?\"의 질문에 4편이 \"제로음료는 사실 발암 걱정은 안 해도 된다\"는 의외의 안도 메시지를 던지면서 시리즈 신뢰도가 정점에 오른다. 단순 위험 나열이 아니라 위험과 안전을 객관적으로 구분하는 매체라는 인식이 5편(단백질바)까지의 정주행을 보장한다.\n\n---\n\n\"제로콜라 매일 마시면 암 걸린다고?\" — 2023년 7월부터 1년 넘게 불안하셨다면 꼭 끝까지 봐주세요.\n\n사실은 이렇습니다\n2023.6 WHO IARC 회의  7.14 아스파탐을 \"발암 가능 물질(Group 2B)\"로 분류  7.15 한국 식약처는 \"현행 ADI 유지\" 발표\n\nGroup 2B의 진짜 의미\n· Group 1: 흡연 · 알코올 · 가공육 (확실한 발암물질)\n· Group 2A: 적색육 · 야간근무 (가능성 높음)\n· Group 2B: 아스파탐 · 김치 · 고사리 (가능성 있음, 인체 증거 부족)\n· Group 3: 카페인 · 차 (분류 불가)\n\n즉 아스파탐은 김치·고사리와 같은 등급입니다. \"발암물질\"  \"먹으면 무조건 암\".\n\n하루 몇 캔까지 안전?\nWHO 1일 허용량(ADI) = 아스파탐 40mg/kg · 제로콜라 1캔  180mg\n이론상 50kg 11캔 / 60kg 13캔 / 70kg 15캔까지 가능하지만\n현실 권장은 하루 1~2캔 (제로사이다·맥스 누적 주의)\n\n□ 진짜 우려는 발암이 아니라 따로 있어요\n단맛 역치 상승  더 단 음식 갈망  다이어트 효과\n장내 미생물 변화 + 인슐린 저항성 연구 진행 중\n단맛만 받고 칼로리 X  뇌가 \"더 먹어\" 신호\n갈증 해소 X (카페인 이뇨로 오히려 탈수)\n\n회피군: 임산부 · 수유부 · 페닐케톤뇨증(PKU) 환자 · 12세 미만 어린이\n\n저장  친구·가족에게 공유해주세요\n\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#제로콜라 #아스파탐 #WHO발암논란 #IARC\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[제로콜라] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 — 다이어터가 꼭 알아야 할 숨은 팩트체크</h1>\n<blockquote>**작성일:** 2026-05-17</blockquote>\n<blockquote>**콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 & 검증 결과</h2>\n<table>\n<tr><th>검증 항목</th><th>검증 기준 및 공인 출처</th><th>판정 및 권고 사항</th></tr>\n<tr><td>**주제 팩트**</td><td>식약처 영양성분 DB / WHO 지침</td><td>WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 관련 영양 수치 정밀 확인</td></tr>\n<tr><td>**칼로리·당류**</td><td>한국영양학회 1일 권장 섭취 기준</td><td>가공식품 및 외식 곁들이 숨은 칼로리 검증</td></tr>\n<tr><td>**감미료/첨가물**</td><td>식품공전 및 공인 학술 자료</td><td>말티톨, 알룰로스, 당알코올 내약량 기준 대조</td></tr>\n</table>\n<h2>🎯 2. 검색 최적화(SEO) 키워드 전략</h2>\n<p style='margin-left: 16px;'>• **메인 키워드:** `제로콜라`</p>\n<p style='margin-left: 16px;'>• **연관 키워드 (8종):** `아스파탐`, `WHO발암논란`, `IARC`, `Group2B`, `제로음료안전섭취량`, `단맛역치`, `PKU`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.</p>\n<p>---</p>\n<h2>💡 3. 블로그 제목 3종 후보</h2>\n<p style='margin-left: 16px;'>• **A타입 (검색 최적화 전진배치형 · 채택):** [제로콜라] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 — 다이어터가 꼭 알아야 할 숨은 팩트체크</p>\n<p style='margin-left: 16px;'>• **B타입 (공감 질문·반전형):** \"WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실</p>\n<p style='margin-left: 16px;'>• **C타입 (수치·현실 가이드형):** 제로콜라 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드</p>\n<p>---</p>\n<h2>🧐 다이어트 중 마주치는 착각과 현실</h2>\n<p>이 콘텐츠는 \"WHO 발암 분류\"라는 단어 하나만 보고 막연히 불안해하던 다이어터에게 <b>정확한 좌표</b>를 제공한다.</p>\n<p>타겟은 2023년 7월 이후 \"제로콜라 = 발암\"이라는 헤드라인을 SNS·뉴스에서 반복 노출당했다. 끊자니 다이어트 중 탄산을 못 마시면 식단이 무너지고, 계속 마시자니 매일 불안한 상태가 1년 넘게 지속 중이다. 표지의 <b>\"암 걸린다고?\"</b>라는 직접 인용 질문은 그동안 입 밖으로 못 꺼냈던 본인의 막연한 불안을 정확히 짚어주고, <b>WHO 라벨</b>은 \"팩트체크가 진짜 들어 있겠다\"는 신뢰의 첫 단추를 채운다.</p>\n<p>저장 동기는 2번 슬라이드의 <b>IARC 분류표</b>에서 발생한다. \"아스파탐 = 김치·고사리와 같은 Group 2B\"라는 한 줄의 의외성은 캡처해서 단톡방에 던지기 좋은 정보다 — <b>지식 우월감 + 즉시 공유 트리거</b>. 동시에 3번 슬라이드의 <b>체중별 안전선 표</b>는 \"내 몸무게 기준 정확히 몇 캔까지\"의 개인 맞춤 정보라 저장 후 반복 확인이 일어난다.</p>\n<p>공유 동기는 두 갈래다. 첫째, 정보 우월감(\"야 너 모르지? 아스파탐 김치랑 같은 등급이래\") — 카페·헬스장 대화 소재. 둘째, <b>보호자 모드</b> — 임산부 친구, 자녀에게 제로음료를 자주 주는 부모, PKU 환자 가족 등 회피군에게 \"이거 꼭 봐야 해\" 메시지로 전달된다. 4번 슬라이드 회피군 박스가 옐로 하이라이트로 시각적으로 튀는 이유다.</p>\n<p>가장 큰 진입 장벽은 <b>이중 메시지의 혼란</b>이다. \"안전하다고 하면서 우려된다고도 하니까 결국 뭘 어떻게 하라는 거야?\" 이를 3번 슬라이드의 <b>명확한 분리</b> — \"발암은 걱정 X / 단맛 의존·장내 미생물·식욕 자극이 진짜 문제 O\" — 로 해소한다. 위험의 정체를 재정의함으로써 \"발암 걱정 끊고 → 단맛 역치에 집중\"으로 행동 방향이 명확해진다.</p>\n<p>행동 지연을 막는 카피는 4번 슬라이드의 <b>\"감미료 로테이션\"</b> 원칙이다. 끊으라는 게 아니라 \"오늘은 제로콜라(아스파탐), 내일은 제로사이다(수크랄로스)\"식으로 바꾸기만 하면 되는 미니멀 행동 변화라 즉시 실행 가능.</p>\n<p>의외의 후크는 <b>시리즈 흐름 안에서의 위치</b>다. 1편(에리스리톨 = 심혈관 위험), 2편(알룰로스 = 장 부작용), 3편(요거트 아이스크림 = 토핑 함정)에서 누적된 \"그럼 뭘 마시지/먹지?\"의 질문에 4편이 <b>\"제로음료는 사실 발암 걱정은 안 해도 된다\"</b>는 의외의 안도 메시지를 던지면서 시리즈 신뢰도가 정점에 오른다. 단순 위험 나열이 아니라 <b>위험과 안전을 객관적으로 구분</b>하는 매체라는 인식이 5편(단백질바)까지의 정주행을 보장한다.</p>\n<p>---</p>\n<p>---</p>\n<h2>📊 카드뉴스로 보는 핵심 분석</h2>\n<h3>[카드뉴스 Point 01] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 1 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 02] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 2 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 03] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 3 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 04] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 4 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 05] WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트 - 슬라이드 5 상세 팩트 카드*</p>\n<p>---</p>\n<h2>💡 상세 영양 데이터 & 메커니즘 분석</h2>\n<p>\"제로콜라 매일 마시면 암 걸린다고?\" — 2023년 7월부터 1년 넘게 불안하셨다면 꼭 끝까지 봐주세요.</p>\n<p>📌 사실은 이렇습니다</p>\n<p>2023.6 WHO IARC 회의 → 7.14 아스파탐을 \"발암 가능 물질(Group 2B)\"로 분류 → 7.15 한국 식약처는 \"현행 ADI 유지\" 발표</p>\n<p>📍 Group 2B의 진짜 의미</p>\n<p>· Group 1: 흡연 · 알코올 · 가공육 (확실한 발암물질)</p>\n<p>· Group 2A: 적색육 · 야간근무 (가능성 높음)</p>\n<p>· <b>Group 2B: 아스파탐 · 김치 · 고사리</b> (가능성 있음, 인체 증거 부족)</p>\n<p>· Group 3: 카페인 · 차 (분류 불가)</p>\n<p>즉 아스파탐은 <b>김치·고사리와 같은 등급</b>입니다. \"발암물질\" ≠ \"먹으면 무조건 암\".</p>\n<p>📋 하루 몇 캔까지 안전?</p>\n<p>WHO 1일 허용량(ADI) = 아스파탐 40mg/kg · 제로콜라 1캔 ≈ 180mg</p>\n<p>이론상 50kg 11캔 / 60kg 13캔 / 70kg 15캔까지 가능하지만</p>\n<p><b>현실 권장은 하루 1~2캔</b> (제로사이다·맥스 누적 주의)</p>\n<p>⚠️ 진짜 우려는 발암이 아니라 따로 있어요</p>\n<p>🧠 단맛 역치 상승 → 더 단 음식 갈망 → 다이어트 효과 ↓</p>\n<p>🦠 장내 미생물 변화 + 인슐린 저항성 연구 진행 중</p>\n<p>😋 단맛만 받고 칼로리 X → 뇌가 \"더 먹어\" 신호</p>\n<p>💧 갈증 해소 X (카페인 이뇨로 오히려 탈수)</p>\n<p>🚫 회피군: 임산부 · 수유부 · 페닐케톤뇨증(PKU) 환자 · 12세 미만 어린이</p>\n<p>🔖 저장 → 친구·가족에게 공유해주세요</p>\n<p>---</p>\n<h2>🛡️ 다이어터 현실 생존 가이드</h2>\n<blockquote>**💡 다이어트 생존 핵심 수칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>- **1. 주 메뉴보다 곁들이를 통제하라**: 탄수화물/알코올 곁들이(냉면, 소주, 볶음밥 등)가 칼로리의 주범입니다.</blockquote>\n<blockquote>- **2. 식이섬유(채소) 먼저 섭취**: 첫 입을 채소로 시작하여 혈당 스파이크와 과식을 방어하세요.</blockquote>\n<blockquote>- **3. 성분표 읽는 습관 들이기**: 마케팅 문구(무설탕, 제로)에 현혹되지 말고 원재료명을 확인하세요.</blockquote>\n<p>---</p>\n<h2>📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)</h2>\n<blockquote>[!TIP]</blockquote>\n<blockquote>**\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**</blockquote>\n<blockquote>말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!</blockquote>\n<blockquote>👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**</blockquote>\n<p>---</p>\n<h2>📝 한 줄 요약 & 실천 팁</h2>\n<p>1. <b>WHO 아스파탐 발암 논란 정확 해석 + 일일 안전 섭취량 + 진짜 우려 포인트</b>은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.</p>\n<p>2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.</p>\n<p>*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #제로콜라 #아스파탐 #WHO발암논란 #IARC #Group2B #제로음료안전섭취량 #단맛역치 #PKU #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법</p>"}}, {"category": "시리즈_SVG(트랙A)", "folder_name": "5_protein_bar", "data": {"folder": "5_protein_bar", "blog_md": "# [단백질바] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n\n> **작성일:** 2026-05-17  \n> **콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브  \n> **타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자\n\n---\n\n## 🔍 1. 사전 팩트체크 & 검증 결과\n\n| 검증 항목 | 검증 기준 및 공인 출처 | 판정 및 권고 사항 |\n|---|---|---|\n| **주제 팩트** | 식약처 영양성분 DB / WHO 지침 | 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 관련 영양 수치 정밀 확인 |\n| **칼로리·당류** | 한국영양학회 1일 권장 섭취 기준 | 가공식품 및 외식 곁들이 숨은 칼로리 검증 |\n| **감미료/첨가물** | 식품공전 및 공인 학술 자료 | 말티톨, 알룰로스, 당알코올 내약량 기준 대조 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `단백질바`\n- **연관 키워드 (8종):** `프로틴바`, `WPI`, `WPC`, `콜라겐함정`, `다이어트간식`, `운동간식`, `자연단백질`\n- **독자 검색 의도:** 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.\n\n---\n\n## 💡 3. 블로그 제목 3종 후보\n\n- **A타입 (검색 최적화 전진배치형 · 채택):** [단백질바] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n- **B타입 (공감 질문·반전형):** \"인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실\n- **C타입 (수치·현실 가이드형):** 단백질바 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드\n\n---\n\n## 🧐 다이어트 중 마주치는 착각과 현실\n\n이 콘텐츠는 \"다이어트 + 단백질 + 가격 = 단백질바\"라는 자동화된 선택 회로를 정조준한다. 시리즈 5편 중 가장 **즉시 행동 변화**가 일어나는 콘텐츠다.\n\n타겟은 헬스장 갔다 와서, 야근 후 편의점에서 거의 \"기계적으로\" 단백질바를 집어왔다. 본인이 건강한 선택을 했다는 자기 효능감으로 1년 넘게 같은 제품을 반복 구매해왔는데, 표지의 **\"그냥 초콜릿바일 수도\"**라는 한 줄이 그 자동화 회로를 깨뜨린다. 운동을 했다는 행위와 잘못된 보충이 만나서 **노력이 무력화됐을 수도 있다**는 충격은 다이어터의 자기 효능감을 직격하는 가장 강한 후크다.\n\n저장 동기는 2번 슬라이드의 **5종 비교표 + 스니커즈 비교**에서 정점에 달한다. \"내가 매번 사던 게 D나 E등급일 수도\"라는 자기 점검 욕구가 즉시 발동하고, **댓글로 제품명 공개**라는 장치는 본문 저장 + 댓글 알림 설정 + 재방문까지 한 흐름으로 묶는다. 3번 슬라이드의 5함정 — 특히 **콜라겐 함정(20g 중 실제 5g)**은 캡처해서 헬스 단톡방에 던지기 좋은 정보 포맷이다.\n\n공유 동기는 강력하다. 헬스장·러닝 크루·다이어트 단톡방에서 **\"야 이거 봐봐, 우리 OO바 먹는 거 콜라겐 함정이래\"** 식 메시지가 자생적으로 발생한다. 정보 우월감 + 동료 보호 본능이 동시 작동. 특히 콜라겐 함정은 SNS에서 \"처음 들어본 정보\"라 캡처 공유율이 매우 높다.\n\n가장 큰 진입 장벽은 \"그래도 닭가슴살 매번 챙기긴 귀찮은데\"의 현실 제약이다. 이를 4번 슬라이드의 **3원칙(단백질 15g↑ / 당류 5g↓ / WPI 우선)**으로 해소한다. 단백질바를 끊으라는 게 아니라 **\"잘 고르라\"**는 메시지라 행동 부담이 최소화된다. 동시에 자연 단백질 5종 가성비 비교는 \"이렇게 싸고 좋다고?\"의 의외성으로 단백질바 외 선택지로의 자연스러운 전환을 유도한다.\n\n행동 지연을 막는 카피는 3번 슬라이드의 마무리 **\"성분표 5초 체크 = 잘못 산 단백질바 3,000원 절약\"**이다. 추상적 건강 가치가 아닌 **즉시적 금전 효익**으로 환산한 카피는 다이어터의 즉시 행동을 트리거한다.\n\n의외의 후크는 **시리즈 완결편이라는 위치 자체**다. 마지막 슬라이드는 1~4편을 회상하는 5편 칩으로 시작해, **\"다이어트 디저트는 없다, 성분표 읽는 습관만 있다\"**는 한 줄 철학으로 시리즈 전체를 한 줄 정리한다. 이 한 줄은 시리즈를 안 본 사람에게는 \"1~4편도 챙겨봐야겠다\"는 역방향 정주행 동기를, 시리즈를 다 본 사람에게는 **\"이 계정 팔로우는 정답\"**이라는 확신을 만든다. 다음 시리즈 \"다이어터의 외식 가이드\"로의 자연스러운 흐름까지 동시 확보 — 콘텐츠 자체가 **팔로우 트리거 + 시리즈 잠금장치**로 기능한다.\n\n---\n\n---\n\n## 📊 카드뉴스로 보는 핵심 분석\n\n### [카드뉴스 Point 01] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 핵심 검증\n\n![카드뉴스 슬라이드 1](slide_1.svg)\n\n*▲ 인기 의 주범입니다.\n> - **2. 식이섬유(채소) 먼저 섭취**: 첫 입을 채소로 시작하여 혈당 스파이크와 과식을 방어하세요.\n> - **3. 성분표 읽는 습관 들이기**: 마케팅 문구(무설탕, 제로)에 현혹되지 말고 원재료명을 확인하세요.\n\n---\n\n## 📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)\n\n> [!TIP]\n> **\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**  \n> 말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!\n> 👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**\n\n---\n\n## 📝 한 줄 요약 & 실천 팁\n\n1. **인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안**은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.\n2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.\n\n\n*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*\n\n\n---\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #단백질바 #프로틴바 #WPI #WPC #콜라겐함정 #다이어트간식 #운동간식 #자연단백질 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법", "app_md": "# [앱게시판] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안에 대한 영양 팩트체크 정보입니다.\n\n이 콘텐츠는 \"다이어트 + 단백질 + 가격 = 단백질바\"라는 자동화된 선택 회로를 정조준한다. 시리즈 5편 중 가장 즉시 행동 변화가 일어나는 콘텐츠다.\n\n타겟은 헬스장 갔다 와서, 야근 후 편의점에서 거의 \"기계적으로\" 단백질바를 집어왔다. 본인이 건강한 선택을 했다는 자기 효능감으로 1년 넘게 같은 제품을 반복 구매해왔는데, 표지의 \"그냥 초콜릿바일 수도\"라는 한 줄이 그 자동화 회로를 깨뜨린다. 운동을 했다는 행위와 잘못된 보충이 만나서 노력이 무력화됐을 수도 있다는 충격은 다이어터의 자기 효능감을 직격하는 가장 강한 후크다.\n\n저장 동기는 2번 슬라이드의 5종 비교표 + 스니커즈 비교에서 정점에 달한다. \"내가 매번 사던 게 D나 E등급일 수도\"라는 자기 점검 욕구가 즉시 발동하고, 댓글로 제품명 공개라는 장치는 본문 저장 + 댓글 알림 설정 + 재방문까지 한 흐름으로 묶는다. 3번 슬라이드의 5함정 — 특히 콜라겐 함정(20g 중 실제 5g)은 캡처해서 헬스 단톡방에 던지기 좋은 정보 포맷이다.\n\n공유 동기는 강력하다. 헬스장·러닝 크루·다이어트 단톡방에서 \"야 이거 봐봐, 우리 OO바 먹는 거 콜라겐 함정이래\" 식 메시지가 자생적으로 발생한다. 정보 우월감 + 동료 보호 본능이 동시 작동. 특히 콜라겐 함정은 SNS에서 \"처음 들어본 정보\"라 캡처 공유율이 매우 높다.\n\n가장 큰 진입 장벽은 \"그래도 닭가슴살 매번 챙기긴 귀찮은데\"의 현실 제약이다. 이를 4번 슬라이드의 3원칙(단백질 15g / 당류 5g / WPI 우선)으로 해소한다. 단백질바를 끊으라는 게 아니라 \"잘 고르라\"는 메시지라 행동 부담이 최소화된다. 동시에 자연 단백질 5종 가성비 비교는 \"이렇게 싸고 좋다고?\"의 의외성으로 단백질바 외 선택지로의 자연스러운 전환을 유도한다.\n\n행동 지연을 막는 카피는 3번 슬라이드의 마무리 \"성분표 5초 체크 = 잘못 산 단백질바 3,000원 절약\"이다. 추상적 건강 가치가 아닌 즉시적 금전 효익으로 환산한 카피는 다이어터의 즉시 행동을 트리거한다.\n\n의외의 후크는 시리즈 완결편이라는 위치 자체다. 마지막 슬라이드는 1~4편을 회상하는 5편 칩으로 시작해, \"다이어트 디저트는 없다, 성분표 읽는 습관만 있다\"는 한 줄 철학으로 시리즈 전체를 한 줄 정리한다. 이 한 줄은 시리즈를 안 본 사람에게는 \"1~4편도 챙겨봐야겠다\"는 역방향 정주행 동기를, 시리즈를 다 본 사람에게는 \"이 계정 팔로우는 정답\"이라는 확신을 만든다. 다음 시리즈 \"다이어터의 외식 가이드\"로의 자연스러운 흐름까지 동시 확보 — 콘텐츠 자체가 팔로우 트리거 + 시리즈 잠금장치로 기능한다.\n\n---\n\n\"운동까지 했는데 단백질바 잘못 골랐다면…?\" — 시리즈 마지막 편, 단백질바 5종 솔직 비교입니다.\n\n시중 인기 5종 비교 (1개당 영양성분)\nA: 단백질 20g / 당류 3g / 포화지방 2g / 200kcal\nB: 단백질 15g / 당류 5g / 포화지방 3g / 210kcal\nC: 단백질 12g / 당류 10g / 포화지방 5g / 240kcal\nD: 단백질 10g / 당류 15g / 포화지방 7g / 270kcal\nE: 단백질 8g / 당류 18g / 포화지방 8g / 290kcal\n\n□ 충격 비교\n스니커즈 1개(50g): 단백질 4g / 당류 26g / 250kcal\nE등급 단백질바와 당류 차이 단 8g\n\n살 때 피해야 할 5가지\n1□ 당류  10g (사실상 초콜릿바)\n2□ 포화지방  5g (코코아버터·팜유 의심)\n3□ 콜라겐만 잔뜩 (단백질 20g 표시 중 실제 활용 5g)\n4□ 단백질 < 10g (살 이유 X)\n5□ 알룰로스 + 말티톨 동시 (장 부작용 )\n\n똑똑한 3원칙\n단백질  15g (운동 보충 최소선 / 식사 대용 20g)\n당류  5g (운동 효과 무력화 방지선)\n단백질 종류 = WPI·WPC·카제인·분리대두단백  / 콜라겐·밀단백 단독\n\n가성비 자연 단백질\n삶은 달걀 2개(단백질 12g, 200원) · 닭가슴살 100g(23g, 2,000원) · 그릭요거트 100g(10g, 1,500원)\n\n단백질바는 \"이동 중·시간 없을 때만\" 쓰는 간편 대안. 진짜 보충은 자연식이 답입니다.\n\n디저트 팩트체크 시리즈 5편 완결!\n① 에리스리톨  분산 / ② 알룰로스  24g 룰 / ③ 요아정  토핑이 범인 / ④ 제로콜라  1~2캔 룰 / ⑤ 단백질바  15g/5g\n\n5편 모두 저장  마트·편의점·카페 갈 때 꺼내보세요\n\n\n[핵심 실천 수칙]\n□ 주 메뉴보다 곁들이(탄수화물, 당류) 섭취 조절\n□ 채소류 먼저 섭취하여 혈당 상승 완충\n□ 무설탕 표기 이면의 원재료 성분 확인\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#단백질바 #프로틴바 #WPI #WPC\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[단백질바] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크</h1>\n<blockquote>**작성일:** 2026-05-17</blockquote>\n<blockquote>**콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 & 검증 결과</h2>\n<table>\n<tr><th>검증 항목</th><th>검증 기준 및 공인 출처</th><th>판정 및 권고 사항</th></tr>\n<tr><td>**주제 팩트**</td><td>식약처 영양성분 DB / WHO 지침</td><td>인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 관련 영양 수치 정밀 확인</td></tr>\n<tr><td>**칼로리·당류**</td><td>한국영양학회 1일 권장 섭취 기준</td><td>가공식품 및 외식 곁들이 숨은 칼로리 검증</td></tr>\n<tr><td>**감미료/첨가물**</td><td>식품공전 및 공인 학술 자료</td><td>말티톨, 알룰로스, 당알코올 내약량 기준 대조</td></tr>\n</table>\n<h2>🎯 2. 검색 최적화(SEO) 키워드 전략</h2>\n<p style='margin-left: 16px;'>• **메인 키워드:** `단백질바`</p>\n<p style='margin-left: 16px;'>• **연관 키워드 (8종):** `프로틴바`, `WPI`, `WPC`, `콜라겐함정`, `다이어트간식`, `운동간식`, `자연단백질`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.</p>\n<p>---</p>\n<h2>💡 3. 블로그 제목 3종 후보</h2>\n<p style='margin-left: 16px;'>• **A타입 (검색 최적화 전진배치형 · 채택):** [단백질바] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 — 다이어터가 꼭 알아야 할 숨은 팩트체크</p>\n<p style='margin-left: 16px;'>• **B타입 (공감 질문·반전형):** \"인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실</p>\n<p style='margin-left: 16px;'>• **C타입 (수치·현실 가이드형):** 단백질바 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드</p>\n<p>---</p>\n<h2>🧐 다이어트 중 마주치는 착각과 현실</h2>\n<p>이 콘텐츠는 \"다이어트 + 단백질 + 가격 = 단백질바\"라는 자동화된 선택 회로를 정조준한다. 시리즈 5편 중 가장 <b>즉시 행동 변화</b>가 일어나는 콘텐츠다.</p>\n<p>타겟은 헬스장 갔다 와서, 야근 후 편의점에서 거의 \"기계적으로\" 단백질바를 집어왔다. 본인이 건강한 선택을 했다는 자기 효능감으로 1년 넘게 같은 제품을 반복 구매해왔는데, 표지의 <b>\"그냥 초콜릿바일 수도\"</b>라는 한 줄이 그 자동화 회로를 깨뜨린다. 운동을 했다는 행위와 잘못된 보충이 만나서 <b>노력이 무력화됐을 수도 있다</b>는 충격은 다이어터의 자기 효능감을 직격하는 가장 강한 후크다.</p>\n<p>저장 동기는 2번 슬라이드의 <b>5종 비교표 + 스니커즈 비교</b>에서 정점에 달한다. \"내가 매번 사던 게 D나 E등급일 수도\"라는 자기 점검 욕구가 즉시 발동하고, <b>댓글로 제품명 공개</b>라는 장치는 본문 저장 + 댓글 알림 설정 + 재방문까지 한 흐름으로 묶는다. 3번 슬라이드의 5함정 — 특히 <b>콜라겐 함정(20g 중 실제 5g)</b>은 캡처해서 헬스 단톡방에 던지기 좋은 정보 포맷이다.</p>\n<p>공유 동기는 강력하다. 헬스장·러닝 크루·다이어트 단톡방에서 <b>\"야 이거 봐봐, 우리 OO바 먹는 거 콜라겐 함정이래\"</b> 식 메시지가 자생적으로 발생한다. 정보 우월감 + 동료 보호 본능이 동시 작동. 특히 콜라겐 함정은 SNS에서 \"처음 들어본 정보\"라 캡처 공유율이 매우 높다.</p>\n<p>가장 큰 진입 장벽은 \"그래도 닭가슴살 매번 챙기긴 귀찮은데\"의 현실 제약이다. 이를 4번 슬라이드의 <b>3원칙(단백질 15g↑ / 당류 5g↓ / WPI 우선)</b>으로 해소한다. 단백질바를 끊으라는 게 아니라 <b>\"잘 고르라\"</b>는 메시지라 행동 부담이 최소화된다. 동시에 자연 단백질 5종 가성비 비교는 \"이렇게 싸고 좋다고?\"의 의외성으로 단백질바 외 선택지로의 자연스러운 전환을 유도한다.</p>\n<p>행동 지연을 막는 카피는 3번 슬라이드의 마무리 <b>\"성분표 5초 체크 = 잘못 산 단백질바 3,000원 절약\"</b>이다. 추상적 건강 가치가 아닌 <b>즉시적 금전 효익</b>으로 환산한 카피는 다이어터의 즉시 행동을 트리거한다.</p>\n<p>의외의 후크는 <b>시리즈 완결편이라는 위치 자체</b>다. 마지막 슬라이드는 1~4편을 회상하는 5편 칩으로 시작해, <b>\"다이어트 디저트는 없다, 성분표 읽는 습관만 있다\"</b>는 한 줄 철학으로 시리즈 전체를 한 줄 정리한다. 이 한 줄은 시리즈를 안 본 사람에게는 \"1~4편도 챙겨봐야겠다\"는 역방향 정주행 동기를, 시리즈를 다 본 사람에게는 <b>\"이 계정 팔로우는 정답\"</b>이라는 확신을 만든다. 다음 시리즈 \"다이어터의 외식 가이드\"로의 자연스러운 흐름까지 동시 확보 — 콘텐츠 자체가 <b>팔로우 트리거 + 시리즈 잠금장치</b>로 기능한다.</p>\n<p>---</p>\n<p>---</p>\n<h2>📊 카드뉴스로 보는 핵심 분석</h2>\n<h3>[카드뉴스 Point 01] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 - 슬라이드 1 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 02] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 - 슬라이드 2 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 03] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 - 슬라이드 3 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 04] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 - 슬라이드 4 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 05] 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안 - 슬라이드 5 상세 팩트 카드*</p>\n<p>---</p>\n<h2>💡 상세 영양 데이터 & 메커니즘 분석</h2>\n<p>\"운동까지 했는데 단백질바 잘못 골랐다면…?\" — 시리즈 마지막 편, 단백질바 5종 솔직 비교입니다.</p>\n<p>📌 시중 인기 5종 비교 (1개당 영양성분)</p>\n<p>A: 단백질 20g / 당류 3g / 포화지방 2g / 200kcal ⭐⭐⭐⭐⭐</p>\n<p>B: 단백질 15g / 당류 5g / 포화지방 3g / 210kcal ⭐⭐⭐⭐</p>\n<p>C: 단백질 12g / 당류 10g / 포화지방 5g / 240kcal ⭐⭐⭐</p>\n<p>D: 단백질 10g / 당류 15g / 포화지방 7g / 270kcal ⭐⭐</p>\n<p>E: 단백질 8g / 당류 18g / 포화지방 8g / 290kcal ⭐</p>\n<p>⚠️ 충격 비교</p>\n<p>스니커즈 1개(50g): 단백질 4g / 당류 26g / 250kcal</p>\n<p>→ E등급 단백질바와 당류 차이 단 8g</p>\n<p>📍 살 때 피해야 할 5가지</p>\n<p>1️⃣ 당류 ≥ 10g (사실상 초콜릿바)</p>\n<p>2️⃣ 포화지방 ≥ 5g (코코아버터·팜유 의심)</p>\n<p>3️⃣ 콜라겐만 잔뜩 (단백질 20g 표시 중 실제 활용 5g)</p>\n<p>4️⃣ 단백질 < 10g (살 이유 X)</p>\n<p>5️⃣ 알룰로스 + 말티톨 동시 (장 부작용 ↑)</p>\n<p>📋 똑똑한 3원칙</p>\n<p>✅ 단백질 ≥ 15g (운동 보충 최소선 / 식사 대용 20g↑)</p>\n<p>✅ 당류 ≤ 5g (운동 효과 무력화 방지선)</p>\n<p>✅ 단백질 종류 = WPI·WPC·카제인·분리대두단백 ⭕ / 콜라겐·밀단백 단독 ❌</p>\n<p>🥚 가성비 자연 단백질</p>\n<p>삶은 달걀 2개(단백질 12g, 200원) · 닭가슴살 100g(23g, 2,000원) · 그릭요거트 100g(10g, 1,500원)</p>\n<p>💡 단백질바는 \"이동 중·시간 없을 때만\" 쓰는 간편 대안. 진짜 보충은 자연식이 답입니다.</p>\n<p>🎬 디저트 팩트체크 시리즈 5편 완결!</p>\n<p>① 에리스리톨 → 분산 / ② 알룰로스 → 24g 룰 / ③ 요아정 → 토핑이 범인 / ④ 제로콜라 → 1~2캔 룰 / ⑤ 단백질바 → 15g↑/5g↓</p>\n<p>🔖 5편 모두 저장 → 마트·편의점·카페 갈 때 꺼내보세요</p>\n<p>---</p>\n<h2>🛡️ 다이어터 현실 생존 가이드</h2>\n<blockquote>**💡 다이어트 생존 핵심 수칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>- **1. 주 메뉴보다 곁들이를 통제하라**: 탄수화물/알코올 곁들이(냉면, 소주, 볶음밥 등)가 칼로리의 주범입니다.</blockquote>\n<blockquote>- **2. 식이섬유(채소) 먼저 섭취**: 첫 입을 채소로 시작하여 혈당 스파이크와 과식을 방어하세요.</blockquote>\n<blockquote>- **3. 성분표 읽는 습관 들이기**: 마케팅 문구(무설탕, 제로)에 현혹되지 말고 원재료명을 확인하세요.</blockquote>\n<p>---</p>\n<h2>📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)</h2>\n<blockquote>[!TIP]</blockquote>\n<blockquote>**\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**</blockquote>\n<blockquote>말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!</blockquote>\n<blockquote>👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**</blockquote>\n<p>---</p>\n<h2>📝 한 줄 요약 & 실천 팁</h2>\n<p>1. <b>인기 단백질바 5종 영양성분 비교 + 살 때 피해야 할 5함정 + 똑똑한 3원칙 + 자연 단백질 대안</b>은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.</p>\n<p>2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.</p>\n<p>*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*</p>\n<p>---</p>\n<p><b>🏷️ 네이버 블로그 태그 (정확히 30개):</b></p>\n<p>#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #단백질바 #프로틴바 #WPI #WPC #콜라겐함정 #다이어트간식 #운동간식 #자연단백질 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법</p>"}}, {"category": "시리즈_SVG(트랙A)", "folder_name": "dining_1_samgyeopsal", "data": {"folder": "dining_1_samgyeopsal", "blog_md": "# [삼겹살칼로리] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n\n> **작성일:** 2026-06-03  \n> **콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브  \n> **타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자\n\n---\n\n## 🔍 1. 사전 팩트체크 & 검증 결과\n\n| 검증 항목 | 검증 기준 및 공인 출처 | 판정 및 권고 사항 |\n|---|---|---|\n| **주제 팩트** | 식약처 영양성분 DB / WHO 지침 | 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 관련 영양 수치 정밀 확인 |\n| **칼로리·당류** | 한국영양학회 1일 권장 섭취 기준 | 가공식품 및 외식 곁들이 숨은 칼로리 검증 |\n| **감미료/첨가물** | 식품공전 및 공인 학술 자료 | 말티톨, 알룰로스, 당알코올 내약량 기준 대조 |\n\n## 🎯 2. 검색 최적화(SEO) 키워드 전략\n\n- **메인 키워드:** `삼겹살칼로리`\n- **연관 키워드 (8종):** `회식다이어트`, `외식다이어트`, `소주칼로리`, `삼겹살냉면`, `다이어트외식`, `회식생존`, `삼겹살다이어트`\n- **독자 검색 의도:** 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.\n\n---\n\n## 💡 3. 블로그 제목 3종 후보\n\n- **A타입 (검색 최적화 전진배치형 · 채택):** [삼겹살칼로리] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크\n- **B타입 (공감 질문·반전형):** \"삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실\n- **C타입 (수치·현실 가이드형):** 삼겹살칼로리 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드\n\n---\n\n## 🧐 다이어트 중 마주치는 착각과 현실\n\n이 콘텐츠는 \"다이어트 중에도 삼겹살은 단백질이니 괜찮다\"는 면죄부를 흔든다.\n\n타겟은 회식·약속에서 삼겹살집을 피할 수 없고, \"고기는 단백질이니까\"라며 죄책감을 덜어왔다. 표지의 \"한 상이 통째로 하루치 칼로리?\"는 그 면죄부를 정조준한다. 다만 브랜드 톤대로 **고기를 끊으라 하지 않는다** — 2번 슬라이드에서 충격 수치를 보여준 뒤, 3번에서 \"고기는 무죄, 범인은 곁들이\"로 반전시켜 안도와 함께 정확한 표적(소주·마무리·장)을 제시한다.\n\n저장 동기는 2번의 **항목별 칼로리 표**와 4번의 **생존 5원칙**이다. 다음 회식 직전에 꺼내볼 \"현실 체크리스트\"라 콘텐츠가 도구처럼 기능한다. 공유 동기는 회식이 집단 행위라는 점에서 강하다 — \"우리 다음 회식 때 이거 보자\"며 직장 단톡방·술친구에게 던지기 좋다. 특히 \"소주 1병 = 밥 1.3공기\"는 캡처 한 장으로 공유되는 임팩트 수치.\n\n가장 큰 진입 장벽은 \"그래도 회식 분위기상 어쩔 수 없다\"는 체념이다. 이를 5원칙의 **\"끊는 게 아니라 순서·양·곁들이만 바꾸기\"**로 해소한다. 분위기를 깨지 않고 적용 가능한 미세 행동이라 실행 부담이 낮다.\n\n행동 지연을 막는 카피는 3번의 **\"고기 줄이지 말고 곁들이를 줄여라\"** 한 줄이다. 추상적 절제가 아니라 명확한 표적을 줘서 \"오늘 회식부터\" 적용된다.\n\n의외의 후크는 디저트 팩트체크 시리즈에서 넘어온 독자의 기대 충족이다. \"감미료·디저트를 팩트체크하던 계정이 이제 외식까지\" — 같은 '숨은 칼로리 폭로' 공식을 외식으로 확장해 시리즈 신뢰가 이어지고, 회식·외식이라는 더 넓은 일상으로 도달 범위가 커진다.\n\n---\n\n---\n\n## 📊 카드뉴스로 보는 핵심 분석\n\n### [카드뉴스 Point 01] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증\n\n![카드뉴스 슬라이드 1](slide_1.png)\n\n*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 1 상세 팩트 카드*\n\n### [카드뉴스 Point 02] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증\n\n![카드뉴스 슬라이드 2](slide_2.png)\n\n*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 2 상세 팩트 카드*\n\n### [카드뉴스 Point 03] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증\n\n![카드뉴스 슬라이드 3](slide_3.png)\n\n*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 3 상세 팩트 카드*\n\n### [카드뉴스 Point 04] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증\n\n![카드뉴스 슬라이드 4](slide_4.png)\n\n*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 4 상세 팩트 카드*\n\n### [카드뉴스 Point 05] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증\n\n![카드뉴스 슬라이드 5](slide_5.png)\n\n*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 5 상세 팩트 카드*\n\n---\n\n## 💡 상세 영양 데이터 & 메커니즘 분석\n\n\"다이어트 중이라 삼겹살은 단백질이니까 괜찮아\" — 정말 그럴까요?\n\n📌 삼겹살집 한 상 칼로리 (1인 기준)\n🥓 삼겹살 2인분(400g) 약 1,320kcal\n🍶 소주 1병(360ml) 약 408kcal\n🍜 냉면 마무리 약 550kcal\n→ 합계 약 2,280kcal = 성인 하루 권장 칼로리(2,000~2,500)를 한 끼에\n\n📍 근데 진짜 범인은 '고기'가 아니에요\n고기는 단백질·포만감이라 적당량이면 OK. 문제는 곁들이:\n① 소주 — 빈 칼로리 + 식욕 촉진 (1병 = 밥 1.3공기)\n② 마무리 냉면·볶음밥 — 이미 충분한데 +500~700kcal\n③ 쌈장·기름장 — 숨은 당·나트륨\n\n📋 삼겹살집 생존 5원칙\n1️⃣ 채소부터, 고기는 그 다음\n2️⃣ 소주는 반 병까지 (물 자주)\n3️⃣ 마무리 냉면·볶음밥 생략 (정 먹으면 반만)\n4️⃣ 쌈장 대신 소금·명이·마늘\n5️⃣ 하루 총량으로 — 과식한 날은 다음 끼 가볍게\n\n🔖 저장 → 회식 가기 전에 꺼내보세요\n\n---\n\n## 🛡️ 다이어터 현실 생존 가이드\n\n> **💡 오늘부터 즉시 적용하는 실천 원칙:**\n>\n> - 1. 채소부터, 고기는 그 다음 (포만감·혈당 완충)\n> - 2. 소주는 반 병까지 (물 자주)\n> - 3. 마무리 냉면·볶음밥 생략 (정 먹으면 반만)\n> - 4. 쌈장 대신 소금·명이·마늘\n> - 5. 하루 총량으로 본다 (과식한 날 다음 끼 가볍게)\n\n\n---\n\n## 📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)\n\n> [!TIP]\n> **\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**  \n> 말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!\n> 👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**\n\n---\n\n## 📝 한 줄 요약 & 실천 팁\n\n1. **삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙**은(는) 무작정 굶거나 참는 것이 답이 아니라, 정확한 성분과 곁들이를 알고 먹는 것이 핵심입니다.\n2. 인스타그램 `@dessrtj`를 팔로우하시면 더 많은 디저트·외식 팩트체크 정보를 가장 빠르게 받아보실 수 있습니다.\n\n\n*본 콘텐츠는 식품의약품안전처 영양성분 DB 및 공인 연구 논문을 바탕으로 작성된 정보 제공 목적의 글이며, 전문적인 의학적 진단이나 치료를 대신할 수 없습니다.*\n\n\n---\n**🏷️ 네이버 블로그 태그 (정확히 30개):**\n\n#dessrtj #디저트팩트체크 #다이어트식단 #무설탕 #제로슈거 #다이어터 #혈당관리 #성분표읽기 #영양성분 #다이어트외식 #삼겹살칼로리 #회식다이어트 #외식다이어트 #소주칼로리 #삼겹살냉면 #회식생존 #삼겹살다이어트 #체중감량 #칼로리조절 #외식가이드 #다이어트꿀팁 #직장인다이어트 #건강식단 #유지어터 #헬스식단 #당류조절 #식이요법", "app_md": "# [앱게시판] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 칼로리 팩트체크\n\n## 1. 게시판 제목\n\n삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 칼로리 팩트체크\n\n## 2. 게시판 본문 설명\n\n삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙에 대한 영양 팩트체크 정보입니다.\n\n이 콘텐츠는 \"다이어트 중에도 삼겹살은 단백질이니 괜찮다\"는 면죄부를 흔든다.\n\n타겟은 회식·약속에서 삼겹살집을 피할 수 없고, \"고기는 단백질이니까\"라며 죄책감을 덜어왔다. 표지의 \"한 상이 통째로 하루치 칼로리?\"는 그 면죄부를 정조준한다. 다만 브랜드 톤대로 고기를 끊으라 하지 않는다 — 2번 슬라이드에서 충격 수치를 보여준 뒤, 3번에서 \"고기는 무죄, 범인은 곁들이\"로 반전시켜 안도와 함께 정확한 표적(소주·마무리·장)을 제시한다.\n\n저장 동기는 2번의 항목별 칼로리 표와 4번의 생존 5원칙이다. 다음 회식 직전에 꺼내볼 \"현실 체크리스트\"라 콘텐츠가 도구처럼 기능한다. 공유 동기는 회식이 집단 행위라는 점에서 강하다 — \"우리 다음 회식 때 이거 보자\"며 직장 단톡방·술친구에게 던지기 좋다. 특히 \"소주 1병 = 밥 1.3공기\"는 캡처 한 장으로 공유되는 임팩트 수치.\n\n가장 큰 진입 장벽은 \"그래도 회식 분위기상 어쩔 수 없다\"는 체념이다. 이를 5원칙의 \"끊는 게 아니라 순서·양·곁들이만 바꾸기\"로 해소한다. 분위기를 깨지 않고 적용 가능한 미세 행동이라 실행 부담이 낮다.\n\n행동 지연을 막는 카피는 3번의 \"고기 줄이지 말고 곁들이를 줄여라\" 한 줄이다. 추상적 절제가 아니라 명확한 표적을 줘서 \"오늘 회식부터\" 적용된다.\n\n의외의 후크는 디저트 팩트체크 시리즈에서 넘어온 독자의 기대 충족이다. \"감미료·디저트를 팩트체크하던 계정이 이제 외식까지\" — 같은 '숨은 칼로리 폭로' 공식을 외식으로 확장해 시리즈 신뢰가 이어지고, 회식·외식이라는 더 넓은 일상으로 도달 범위가 커진다.\n\n---\n\n\"다이어트 중이라 삼겹살은 단백질이니까 괜찮아\" — 정말 그럴까요?\n\n삼겹살집 한 상 칼로리 (1인 기준)\n삼겹살 2인분(400g) 약 1,320kcal\n소주 1병(360ml) 약 408kcal\n냉면 마무리 약 550kcal\n합계 약 2,280kcal = 성인 하루 권장 칼로리(2,000~2,500)를 한 끼에\n\n근데 진짜 범인은 '고기'가 아니에요\n고기는 단백질·포만감이라 적당량이면 OK. 문제는 곁들이:\n① 소주 — 빈 칼로리 + 식욕 촉진 (1병 = 밥 1.3공기)\n② 마무리 냉면·볶음밥 — 이미 충분한데 +500~700kcal\n③ 쌈장·기름장 — 숨은 당·나트륨\n\n삼겹살집 생존 5원칙\n1□ 채소부터, 고기는 그 다음\n2□ 소주는 반 병까지 (물 자주)\n3□ 마무리 냉면·볶음밥 생략 (정 먹으면 반만)\n4□ 쌈장 대신 소금·명이·마늘\n5□ 하루 총량으로 — 과식한 날은 다음 끼 가볍게\n\n저장  회식 가기 전에 꺼내보세요\n\n\n[핵심 실천 수칙]\n□ 1. 채소부터, 고기는 그 다음 (포만감·혈당 완충)\n□ 2. 소주는 반 병까지 (물 자주)\n□ 3. 마무리 냉면·볶음밥 생략 (정 먹으면 반만)\n□ 4. 쌈장 대신 소금·명이·마늘\n□ 5. 하루 총량으로 본다 (과식한 날 다음 끼 가볍게)\n\n본 정보는 공인 영양 데이터를 기반으로 한 참고용 가이드입니다.\n\n## 3. 앱 태그 (정확히 4개)\n\n#삼겹살칼로리 #회식다이어트 #외식다이어트 #소주칼로리\n\n## 4. 메타 정보 (검색용)\n\n- **메타 제목:** 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 영양 성분 및 다이어트 생존 가이드\n- **메타 설명:** 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 섭취 시 주의해야 할 숨은 칼로리와 당류 팩트를 확인하세요. 실패 없는 다이어트 식단 실천 수칙 4가지 정리.\n", "blog_html": "<h1>[삼겹살칼로리] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크</h1>\n<blockquote>**작성일:** 2026-06-03</blockquote>\n<blockquote>**콘텐츠 제공:** `@dessrtj` 디저트 팩트체크 허브</blockquote>\n<blockquote>**타깃:** 20~40대 다이어터, 직장인, 건강관리 소비자</blockquote>\n<p>---</p>\n<h2>🔍 1. 사전 팩트체크 & 검증 결과</h2>\n<table>\n<tr><th>검증 항목</th><th>검증 기준 및 공인 출처</th><th>판정 및 권고 사항</th></tr>\n<tr><td>**주제 팩트**</td><td>식약처 영양성분 DB / WHO 지침</td><td>삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 관련 영양 수치 정밀 확인</td></tr>\n<tr><td>**칼로리·당류**</td><td>한국영양학회 1일 권장 섭취 기준</td><td>가공식품 및 외식 곁들이 숨은 칼로리 검증</td></tr>\n<tr><td>**감미료/첨가물**</td><td>식품공전 및 공인 학술 자료</td><td>말티톨, 알룰로스, 당알코올 내약량 기준 대조</td></tr>\n</table>\n<h2>🎯 2. 검색 최적화(SEO) 키워드 전략</h2>\n<p style='margin-left: 16px;'>• **메인 키워드:** `삼겹살칼로리`</p>\n<p style='margin-left: 16px;'>• **연관 키워드 (8종):** `회식다이어트`, `외식다이어트`, `소주칼로리`, `삼겹살냉면`, `다이어트외식`, `회식생존`, `삼겹살다이어트`</p>\n<p style='margin-left: 16px;'>• **독자 검색 의도:** 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙을 섭취하거나 외식할 때 체중 감량에 방해가 되지 않는지, 진짜 성분과 칼로리는 얼마인지 객관적 팩트를 탐색하고자 함.</p>\n<p>---</p>\n<h2>💡 3. 블로그 제목 3종 후보</h2>\n<p style='margin-left: 16px;'>• **A타입 (검색 최적화 전진배치형 · 채택):** [삼겹살칼로리] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 — 다이어터가 꼭 알아야 할 숨은 팩트체크</p>\n<p style='margin-left: 16px;'>• **B타입 (공감 질문·반전형):** \"삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙\" 정말 살 안 찔까? 다이어터 한 상 칼로리의 진실</p>\n<p style='margin-left: 16px;'>• **C타입 (수치·현실 가이드형):** 삼겹살칼로리 팩트 검증: 숨은 칼로리 폭탄 피하는 현실 생존 가이드</p>\n<p>---</p>\n<h2>🧐 다이어트 중 마주치는 착각과 현실</h2>\n<p>이 콘텐츠는 \"다이어트 중에도 삼겹살은 단백질이니 괜찮다\"는 면죄부를 흔든다.</p>\n<p>타겟은 회식·약속에서 삼겹살집을 피할 수 없고, \"고기는 단백질이니까\"라며 죄책감을 덜어왔다. 표지의 \"한 상이 통째로 하루치 칼로리?\"는 그 면죄부를 정조준한다. 다만 브랜드 톤대로 <b>고기를 끊으라 하지 않는다</b> — 2번 슬라이드에서 충격 수치를 보여준 뒤, 3번에서 \"고기는 무죄, 범인은 곁들이\"로 반전시켜 안도와 함께 정확한 표적(소주·마무리·장)을 제시한다.</p>\n<p>저장 동기는 2번의 <b>항목별 칼로리 표</b>와 4번의 <b>생존 5원칙</b>이다. 다음 회식 직전에 꺼내볼 \"현실 체크리스트\"라 콘텐츠가 도구처럼 기능한다. 공유 동기는 회식이 집단 행위라는 점에서 강하다 — \"우리 다음 회식 때 이거 보자\"며 직장 단톡방·술친구에게 던지기 좋다. 특히 \"소주 1병 = 밥 1.3공기\"는 캡처 한 장으로 공유되는 임팩트 수치.</p>\n<p>가장 큰 진입 장벽은 \"그래도 회식 분위기상 어쩔 수 없다\"는 체념이다. 이를 5원칙의 <b>\"끊는 게 아니라 순서·양·곁들이만 바꾸기\"</b>로 해소한다. 분위기를 깨지 않고 적용 가능한 미세 행동이라 실행 부담이 낮다.</p>\n<p>행동 지연을 막는 카피는 3번의 <b>\"고기 줄이지 말고 곁들이를 줄여라\"</b> 한 줄이다. 추상적 절제가 아니라 명확한 표적을 줘서 \"오늘 회식부터\" 적용된다.</p>\n<p>의외의 후크는 디저트 팩트체크 시리즈에서 넘어온 독자의 기대 충족이다. \"감미료·디저트를 팩트체크하던 계정이 이제 외식까지\" — 같은 '숨은 칼로리 폭로' 공식을 외식으로 확장해 시리즈 신뢰가 이어지고, 회식·외식이라는 더 넓은 일상으로 도달 범위가 커진다.</p>\n<p>---</p>\n<p>---</p>\n<h2>📊 카드뉴스로 보는 핵심 분석</h2>\n<h3>[카드뉴스 Point 01] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 1</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 1 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 02] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 2</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 2 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 03] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 3</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 3 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 04] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 4</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 4 상세 팩트 카드*</p>\n<h3>[카드뉴스 Point 05] 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 핵심 검증</h3>\n<div class='img-placeholder'>🖼️ <b>카드뉴스 슬라이드 5</b> (카드뉴스 이미지 업로드 위치)</div>\n<p>*▲ 삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙 - 슬라이드 5 상세 팩트 카드*</p>\n<p>---</p>\n<h2>💡 상세 영양 데이터 & 메커니즘 분석</h2>\n<p>\"다이어트 중이라 삼겹살은 단백질이니까 괜찮아\" — 정말 그럴까요?</p>\n<p>📌 삼겹살집 한 상 칼로리 (1인 기준)</p>\n<p>🥓 삼겹살 2인분(400g) 약 1,320kcal</p>\n<p>🍶 소주 1병(360ml) 약 408kcal</p>\n<p>🍜 냉면 마무리 약 550kcal</p>\n<p>→ 합계 약 2,280kcal = 성인 하루 권장 칼로리(2,000~2,500)를 한 끼에</p>\n<p>📍 근데 진짜 범인은 '고기'가 아니에요</p>\n<p>고기는 단백질·포만감이라 적당량이면 OK. 문제는 곁들이:</p>\n<p>① 소주 — 빈 칼로리 + 식욕 촉진 (1병 = 밥 1.3공기)</p>\n<p>② 마무리 냉면·볶음밥 — 이미 충분한데 +500~700kcal</p>\n<p>③ 쌈장·기름장 — 숨은 당·나트륨</p>\n<p>📋 삼겹살집 생존 5원칙</p>\n<p>1️⃣ 채소부터, 고기는 그 다음</p>\n<p>2️⃣ 소주는 반 병까지 (물 자주)</p>\n<p>3️⃣ 마무리 냉면·볶음밥 생략 (정 먹으면 반만)</p>\n<p>4️⃣ 쌈장 대신 소금·명이·마늘</p>\n<p>5️⃣ 하루 총량으로 — 과식한 날은 다음 끼 가볍게</p>\n<p>🔖 저장 → 회식 가기 전에 꺼내보세요</p>\n<p>---</p>\n<h2>🛡️ 다이어터 현실 생존 가이드</h2>\n<blockquote>**💡 오늘부터 즉시 적용하는 실천 원칙:**</blockquote>\n<blockquote></blockquote>\n<blockquote>- 1. 채소부터, 고기는 그 다음 (포만감·혈당 완충)</blockquote>\n<blockquote>- 2. 소주는 반 병까지 (물 자주)</blockquote>\n<blockquote>- 3. 마무리 냉면·볶음밥 생략 (정 먹으면 반만)</blockquote>\n<blockquote>- 4. 쌈장 대신 소금·명이·마늘</blockquote>\n<blockquote>- 5. 하루 총량으로 본다 (과식한 날 다음 끼 가볍게)</blockquote>\n<p>---</p>\n<h2>📱 내 간식·외식 메뉴 3초 판독기 (FactSweet & EatSurvival)</h2>\n<blockquote>[!TIP]</blockquote>\n<blockquote>**\"내가 오늘 먹은 제로 간식, 진짜 안전할까?\"**</blockquote>\n<blockquote>말티톨 감지, 알룰로스 복용 한도 체크, 외식 칼로리 컷 시뮬레이터를 지금 웹 서비스에서 무료로 체험해보세요!</blockquote>\n<blockquote>👉 **[팩트스위트 & 외식생존기 웹 서비스 바로가기 (오픈 예정)]**</blockquote>\n<p>---</p>\n<h2>📝 한 줄 요약 & 실천 팁</h2>\n<p>1. <b>삼겹살집 한 상의 칼로리 실태 + 곁들이 함정 + 생존 5원칙</b>은(는) 무작정 굶거나 참     let allCampaigns = EMBEDDED_DATA.map(d => ({ category: d.category, folder_name: d.folder_name }));
    let currentCampaign = null;
    let currentContent = null;
    let currentTab = 'blog';

    function init() {
      renderList(allCampaigns);
      if (allCampaigns.length > 0) {
        selectCampaign(allCampaigns[0].folder_name);
      }
    }

    function renderList(list) {
      const ul = document.getElementById('campaign-list');
      ul.innerHTML = '';
      list.forEach(c => {
        const li = document.createElement('li');
        li.className = 'campaign-item' + (currentCampaign === c.folder_name ? ' active' : '');
        li.onclick = () => selectCampaign(c.folder_name);
        li.innerHTML = `
          <div class="campaign-cat">${c.category}</div>
          <div class="campaign-name">${c.folder_name}</div>
          <div class="campaign-badges">
            <span class="badge badge-blog">블로그 2,500자</span>
            <span class="badge badge-app">앱게시판</span>
          </div>
        `;
        ul.appendChild(li);
      });
    }

    function filterCampaigns() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = allCampaigns.filter(c => c.folder_name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
      renderList(filtered);
    }

    function selectCampaign(folder) {
      currentCampaign = folder;
      document.querySelectorAll('.campaign-item').forEach(el => {
        el.classList.toggle('active', el.querySelector('.campaign-name').innerText === folder);
      });
      document.getElementById('current-title').innerText = folder;
      
      const found = EMBEDDED_DATA.find(d => d.folder_name === folder);
      if (found) {
        currentContent = found.data;
        renderViewer();
      }
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((el, idx) => {
        el.classList.toggle('active', (tab === 'blog' && idx === 0) || (tab === 'app' && idx === 1) || (tab === 'raw' && idx === 2));
      });
      renderViewer();
    }

    function renderViewer() {
      if (!currentContent) return;
      const v = document.getElementById('viewer');
      if (currentTab === 'blog') {
        v.className = 'viewer blog-view';
        v.innerHTML = currentContent.blog_html || '<p>내용이 없습니다.</p>';
      } else if (currentTab === 'app') {
        v.className = 'viewer app-view';
        v.innerText = currentContent.app_md || '내용이 없습니다.';
      } else {
        v.className = 'viewer raw-view';
        v.innerText = currentContent.blog_md || '내용이 없습니다.';
      }
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }).catch(err => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    function copyCurrentBlog() {
      if (currentContent && currentContent.blog_md) {
        copyToClipboard(currentContent.blog_md, '📋 네이버 블로그 원고가 복사되었습니다!');
      }
    }

    function copyCurrentTags() {
      if (currentContent && currentContent.blog_md) {
        const m = currentContent.blog_md.match(/🏷️\s*네이버\s*블로그\s*태그[^
]*
+([^
]+)/);
        if (m) {
          copyToClipboard(m[1].trim(), '🏷️ 네이버 블로그 태그 30개가 복사되었습니다!');
        } else {
          alert('태그를 찾을 수 없습니다.');
        }
      }
    }

    function copyCurrentApp() {
      if (currentContent && currentContent.app_md) {
        copyToClipboard(currentContent.app_md, '📱 앱 게시판 텍스트가 복사되었습니다!');
      }
    }

    window.onload = init;
  </script>
